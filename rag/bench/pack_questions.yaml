# 업종 팩 생성 문서의 답 시험 질문(#408·#459 후속). scope는 질문하는 사람이 가진 문서 태그(팩 org.yaml의 역할 기준)입니다.
# must: 답 본문에 있어야 하는 글(정답 값). article: 인용에 있어야 하는 조문 머리(예 "제3조").
# deny: true면 scope에 문서 태그가 없는 질문이라 doc의 인용도 must도 답에 나오면 안 됩니다(권한 밖 새어 나감).
finance:
  - {id: fin-credit-approval, scope: [public, hr-policy, internal-rules, credit-policy], doc: fin-credit-rules, article: 제3조, must: 본부장, question: "여신 금액이 5억 원이면 누구까지 결재를 받아야 하나요?"}
  - {id: fin-collateral-apt, scope: [public, hr-policy, internal-rules, credit-policy], doc: fin-credit-rules, article: 제5조, must: 70퍼센트, question: "아파트를 담보로 잡으면 감정가의 몇 퍼센트까지 인정하나요?"}
  - {id: fin-unsecured-limit, scope: [public, hr-policy, internal-rules, credit-policy], doc: fin-credit-rules, article: 제6조, must: "50,000,000원", question: "가계 신용대출은 얼마까지 해 줄 수 있나요?"}
  - {id: fin-split, scope: [public, hr-policy, internal-rules, credit-policy], doc: fin-credit-rules, article: 제4조, must: 피해서는 안, question: "같은 차주에게 나누어 대출해 전결 한도를 피해도 되나요?"}
  - {id: fin-overdue, scope: [public, hr-policy, internal-rules, credit-policy], doc: fin-credit-rules, article: 제7조, must: 30일, question: "대출 연체가 얼마나 지나면 본부장에게 보고하나요?"}
  - {id: fin-conflict, scope: [public, hr-policy, internal-rules], doc: fin-ethics-code, article: 제2조, must: 신고, question: "가족이 차주인 대출 업무를 맡게 되면 어떻게 해야 하나요?"}
  - {id: fin-export, scope: [public, hr-policy, internal-rules], doc: fin-ethics-code, article: 제4조, must: 금지, question: "고객 목록을 개인 메신저로 보내도 되나요?"}
  - {id: fin-vacation, scope: [public, hr-policy, internal-rules], doc: fin-leave-rules, article: 제7조, must: 5영업일, question: "연속 휴가는 연 몇 번 써야 하고 며칠인가요?"}
  - {id: fin-sick, scope: [public, hr-policy, internal-rules], doc: fin-leave-rules, article: 제5조, must: 3일, question: "병가에 진단서는 언제 내야 하나요?"}
  - {id: fin-hours, scope: [public, hr-policy, internal-rules], doc: fin-work-rules, article: 제2조, must: 8시간, question: "하루 근로시간은 몇 시간인가요?"}
  - {id: fin-findings, scope: [public, hr-policy, internal-rules, compliance-restricted], doc: fin-control-findings, article: "1.", must: 3건, question: "최근 분기 여신 분할 취급이 의심되는 건은 몇 건인가요?"}
  - {id: fin-deny-credit, scope: [public, hr-policy, internal-rules], doc: fin-credit-rules, deny: true, must: 70퍼센트, question: "아파트를 담보로 잡으면 감정가의 몇 퍼센트까지 인정하나요?"}
  - {id: fin-deny-findings, scope: [public, hr-policy, internal-rules, credit-policy], doc: fin-control-findings, deny: true, must: 3건, question: "최근 분기 여신 분할 취급이 의심되는 건은 몇 건인가요?"}
it-services:
  - {id: its-effort-due, scope: [public, hr-policy, project-standards], doc: its-project-standards, article: 제2조, must: 월요일, question: "공수 보고는 언제까지 올려야 하나요?"}
  - {id: its-effort-cap, scope: [public, hr-policy, project-standards], doc: its-project-standards, article: 제2조, must: 60시간, question: "한 주에 투입 시간을 최대 몇 시간까지 보고할 수 있나요?"}
  - {id: its-change, scope: [public, hr-policy, project-standards], doc: its-project-standards, article: 제4조, must: 변경 요청서, question: "고객사가 구두로 범위 변경을 요청하면 바로 작업해도 되나요?"}
  - {id: its-grade1, scope: [public, hr-policy, ops-runbook], doc: its-ops-runbook, article: 제3조, must: 15분, question: "1등급 장애는 몇 분 안에 대응을 시작해야 하나요?"}
  - {id: its-admin-account, scope: [public, hr-policy, ops-runbook], doc: its-ops-runbook, article: 제5조, must: 승인, question: "관리자 권한 계정은 누구의 승인을 받아 발급하나요?"}
  - {id: its-report, scope: [public, hr-policy, ops-runbook], doc: its-ops-runbook, article: 제4조, must: 3영업일, question: "장애 보고서는 복구 뒤 며칠 안에 고객사에 내나요?"}
  - {id: its-sla, scope: [public, hr-policy, customer-contracts], doc: its-customer-contract-sample, article: 제2조, must: 99.5퍼센트, question: "월 가용률 목표는 얼마인가요?"}
  - {id: its-penalty, scope: [public, hr-policy, customer-contracts], doc: its-customer-contract-sample, article: 제3조, must: 5퍼센트, question: "월 가용률이 목표에 못 미치면 얼마를 깎아 주나요?"}
  - {id: its-terminate, scope: [public, hr-policy, customer-contracts], doc: its-customer-contract-sample, article: 제4조, must: 3개월, question: "계약을 해지하려면 언제까지 알려야 하나요?"}
  - {id: its-leave, scope: [public, hr-policy, project-standards], doc: its-leave-rules, article: 제4조, must: 2주, question: "프로젝트 투입 중에 5일 넘게 연속으로 쉬려면 언제까지 신청하나요?"}
  - {id: its-hours, scope: [public, hr-policy, project-standards], doc: its-work-rules, article: 제2조, must: 8시간, question: "하루 근로시간은 몇 시간인가요?"}
  - {id: its-deny-contract, scope: [public, hr-policy, project-standards], doc: its-customer-contract-sample, deny: true, must: 5퍼센트, question: "월 가용률이 목표에 못 미치면 얼마를 깎아 주나요?"}
  - {id: its-deny-runbook, scope: [public, hr-policy, project-standards], doc: its-ops-runbook, deny: true, must: 15분, question: "1등급 장애는 몇 분 안에 대응을 시작해야 하나요?"}
