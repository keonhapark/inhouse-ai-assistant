[project]
name = "rag"
version = "0.1.0"
description = "규정·안내 문서 검색과 근거 붙은 답"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.165.0",
  "uvicorn==0.54.0",
  "pyjwt[crypto]==2.15.1",
  "pyyaml==6.0.3",
  "httpx==0.28.1",
  "jsonschema==4.26.0",
]

[dependency-groups]
dev = [
    "olefile==0.47",
    "pytest==9.2.0",
]
# 법제처 고정본을 다시 받을 때만 씁니다(python -m rag.lawfetch).
fetch = [
    "olefile==0.47",
    "pypdf==7.1.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
