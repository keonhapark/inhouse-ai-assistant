# 결재 양식. erp의 결재 문서 엔진이 이 정의를 그대로 씁니다.
forms:
  - id: leave
    name: 휴가 신청
    stage: 1
    fields:
      type: object
      required: [leave_type, start_date, end_date, reason]
      additionalProperties: false
      properties:
        leave_type:
          type: string
          enum: [annual, half_am, half_pm, sick, special]
          x-labels: {annual: 연차, half_am: 오전 반차, half_pm: 오후 반차, sick: 병가, special: 경조사}
        start_date: {type: string, format: date}
        end_date: {type: string, format: date}
        reason: {type: string, maxLength: 200}
    effects:
      on_final_approval: deduct_leave_balance
      on_withdraw_after_approval: restore_leave_balance
    approval_line:
      - when: {}
        steps: [team_leader]

  - id: expense
    name: 경비 정산
    stage: 2
    fields:
      type: object
      required: [amount, spent_on, merchant, purpose]
      additionalProperties: false
      properties:
        amount: {type: integer, minimum: 1}
        spent_on: {type: string, format: date}
        merchant: {type: string, maxLength: 100}
        business_no: {type: string, pattern: "^[0-9]{3}-[0-9]{2}-[0-9]{5}$"}
        purpose: {type: string, maxLength: 200}
    amount_field: amount
    approval_line:
      - when: {amount_lte: 1000000}
        steps: [team_leader]
      - when: {amount_gt: 1000000}
        steps: [team_leader, division_head]

  - id: purchase
    name: 구매 요청
    stage: 2
    fields:
      type: object
      required: [item_code, quantity, unit_price, total_amount, reason]
      additionalProperties: false
      properties:
        item_code: {type: string}
        quantity: {type: integer, minimum: 1}
        unit_price: {type: integer, minimum: 0}
        total_amount: {type: integer, minimum: 0, description: quantity × unit_price와 같아야 합니다}
        reason: {type: string, maxLength: 200}
    amount_field: total_amount
    approval_line:
      - when: {amount_lte: 5000000}
        steps: [team_leader]
      - when: {amount_gt: 5000000}
        steps: [team_leader, division_head]
