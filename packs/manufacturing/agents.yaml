# 에이전트 등록부. 입구 라우터는 요청을 여기 있는 에이전트 하나에 한 번만 넘깁니다.
# 도구 이름은 contracts/mcp/tools.json에 있어야 합니다(CI 검사).
fallback_agent: assistant

agents:
  - id: assistant
    name: 전사 비서
    version: 0.1.0
    stage: 1
    owner_unit: general-affairs
    description: 공통 규정 질의, 회의실, 일반 안내를 맡고 맞는 부서 에이전트를 안내합니다.
    callable_by:
      roles: [employee]
    tools:
      - org_search_employees
      - room_list_availability
      - room_list_my_reservations
      - room_reserve
      - room_cancel_reservation
      - policy_search
    allowed_risk: [read, reversible_write]
    doc_scopes: [public]
    model_policy:
      mode: external_allowed
    risk_policy:
      read: auto
      reversible_write: auto_with_undo
      irreversible: deny
    routing:
      keywords: [회의실, 예약, 규정, 안내, 어디, 누구]
      examples:
        - 내일 오후 2시에 4명 들어갈 회의실 잡아 줘
        - 출장비 규정이 어떻게 돼?

  - id: hr
    name: 인사
    version: 0.1.0
    stage: 1
    owner_unit: hr
    description: 휴가·반차 결재 요청과 회수, 결재 대결 등록·해지 요청, 인사 규정, 본인 휴가 잔여를 맡습니다.
    callable_by:
      roles: [employee]
    tools:
      - hr_get_my_profile
      - leave_get_balance
      - leave_request
      - approval_list_mine
      - approval_get
      - approval_withdraw
      - delegation_list
      - delegation_register
      - delegation_revoke
      - org_search_employees
      - policy_search
    allowed_risk: [read, reversible_write, irreversible]
    doc_scopes: [public, hr-policy, hr-restricted]
    model_policy:
      mode: local_only
      reason: 인사 정보는 외부 LLM으로 보내지 않습니다.
    risk_policy:
      read: auto
      reversible_write: auto_with_undo
      irreversible: confirm
      overrides:
        - tool: delegation_register
          when: wide_scope
          action: confirm
    routing:
      keywords: [휴가, 연차, 반차, 병가, 결재, 대결, 위임, 인사, 잔여]
      examples:
        - 다음 주 금요일 연차 쓸게
        - 내가 휴가 가는 동안 결재를 김 과장에게 맡겨 줘

  - id: finance
    name: 재무
    version: 0.1.0
    stage: 2
    owner_unit: finance
    description: 경비 정산 결재 요청과 회수, 재무 규정(여비·경비) 질의를 맡습니다.
    callable_by:
      roles: [employee]
    tools:
      - expense_request
      - approval_list_mine
      - approval_get
      - approval_withdraw
      - policy_search
    allowed_risk: [read, reversible_write, irreversible]
    doc_scopes: [public, finance-policy]
    model_policy:
      mode: local_only
      reason: 금액·거래처·사업자번호가 든 재무 정보는 외부 LLM으로 보내지 않습니다.
    risk_policy:
      read: auto
      reversible_write: auto_with_undo
      irreversible: confirm
      overrides:
        # 100만 원 넘는 경비 정산은 실행 전에 요청자 확인을 받습니다(결재선이 본부장까지 가는 금액과 같음)
        - {tool: expense_request, when: {arg: amount, gt: 1000000}, action: confirm}
    routing:
      keywords: [경비, 정산, 영수증, 출장비, 여비, 법인카드, 지출]
      examples:
        - 어제 거래처 점심 4만 2천 원 경비 정산 올려 줘
        - 출장 숙박비 한도가 얼마야?
    image_reading:
      purpose: 영수증
      draft_tool: expense_request
      fields:
        - {name: amount, type: integer, description: 합계 금액(원)}
        - {name: spent_on, type: date, description: 사용일}
        - {name: merchant, type: string, description: 가맹점 이름, max_length: 40}
        - {name: business_no, type: string, description: 사업자번호, pattern: "^[0-9]{3}-[0-9]{2}-[0-9]{5}$"}

  - id: procurement
    name: 구매자재
    version: 0.1.0
    stage: 2
    owner_unit: procurement
    description: 구매 요청 결재와 회수, 구매 절차 질의를 맡습니다.
    callable_by:
      roles: [employee]
    tools:
      - purchase_request
      - approval_list_mine
      - approval_get
      - approval_withdraw
      - item_search
      - policy_search
    allowed_risk: [read, reversible_write, irreversible]
    doc_scopes: [public, purchase-policy]
    model_policy:
      mode: external_allowed
    risk_policy:
      read: auto
      reversible_write: auto_with_undo
      irreversible: confirm
      overrides:
        # 500만 원 넘는 구매 요청은 실행 전에 요청자 확인을 받습니다(결재선이 본부장까지 가는 금액과 같음)
        - {tool: purchase_request, when: {arg: total_amount, gt: 5000000}, action: confirm}
    routing:
      keywords: [구매, 발주, 자재, 품목, 단가, 수량, 견적]
      examples:
        - 베어링 BRG-6204 200개 개당 3,500원으로 구매 요청 올려 줘
        - 500만 원 넘는 구매는 누가 결재해?

  - id: it_ops
    name: IT운영
    version: 0.1.0
    stage: 2
    owner_unit: it-ops
    description: 장애·계정·권한 티켓 접수와 조회, 댓글로 진행 상황 묻기, IT 운영 규정 질의를 맡습니다.
    callable_by:
      roles: [employee]
    tools:
      - ticket_list
      - ticket_get
      - ticket_create
      - ticket_comment
      - incident_analyze
      - policy_search
    allowed_risk: [read, reversible_write]
    doc_scopes: [public, it-policy]
    model_policy:
      mode: local_only
      reason: 장애 티켓에는 내부 시스템 이름·계정·접속 정보가 섞일 수 있어 외부 LLM으로 보내지 않습니다.
    risk_policy:
      read: auto
      reversible_write: auto_with_undo
      irreversible: deny
    routing:
      keywords: [장애, 오류, 접속, 계정, 비밀번호, 권한, 티켓, 메일, VPN, 프린터]
      examples:
        - 그룹웨어 접속이 안 돼요, 장애 접수해 줘
        - 지난주에 올린 계정 권한 요청 어떻게 됐어?

  - id: rnd
    name: 연구소
    version: 0.1.0
    stage: 3
    owner_unit: rnd
    description: 연구소 기술 문서 검색과 도면·기술 문서 이미지 질의를 맡습니다. 연구소 직원만 씁니다.
    callable_by:
      units: [rnd-center, rnd]
    tools:
      - policy_search
    allowed_risk: [read]
    doc_scopes: [public, rnd-confidential]
    model_policy:
      mode: local_only
      reason: 연구 기밀(설계·시험 자료)은 외부 LLM으로 보내지 않습니다.
    risk_policy:
      read: auto
      reversible_write: deny
      irreversible: deny
    routing:
      keywords: [연구, 기술 문서, 도면, 설계, 시험 성적, 부품 번호, 사양, 공차]
      examples:
        - 신형 감속기 시험 성적서에서 소음 기준 찾아 줘
        - 이 도면의 부품 번호랑 주요 치수 읽어 줘
    image_reading:
      purpose: 도면·기술 문서
      fields:
        - {name: part_no, type: string, description: 부품 번호, max_length: 40}
        - {name: title, type: string, description: 도면 이름, max_length: 60}
        - {name: dimensions, type: string_list, description: 치수(단위 포함), max_length: 40}
        - {name: notes, type: string_list, description: 주기·비고, max_length: 80}

  - id: quality
    name: 품질
    version: 0.1.0
    stage: 3
    owner_unit: quality
    description: 불량 사진으로 불량 보고서 초안 쓰기, 불량 보고서 조회, 품질 규정 질의를 맡습니다. 보고서 확정은 품질 담당자가 erp 화면에서 합니다.
    callable_by:
      roles: [employee]
    tools:
      - defect_report_draft
      - defect_report_list
      - defect_report_get
      - policy_search
    allowed_risk: [read, reversible_write]
    doc_scopes: [public, quality-policy]
    model_policy:
      mode: external_allowed
      reason: 불량 보고서와 품질 규정은 기밀이 아닙니다. 사진은 gateway가 로컬 비전으로만 보냅니다.
    risk_policy:
      read: auto
      reversible_write: auto_with_undo
      irreversible: deny
    routing:
      keywords: [불량, 품질, 결함, 부적합, 검사, 클레임, 로트]
      examples:
        - 사출 라인에서 나온 불량 사진이야, 불량 보고서 초안 써 줘
        - 지난주에 쓴 불량 보고서 어떻게 됐어?
    image_reading:
      purpose: 불량 사진
      draft_tool: defect_report_draft
      fields:
        - {name: item_code, type: string, description: 품목 코드(라벨이 보이면), max_length: 32}
        - {name: defect_type, type: string, description: 불량 유형(예 긁힘·찍힘·균열·변색), max_length: 50}
        - {name: location, type: string, description: 불량 위치, max_length: 100}
        - {name: severity, type: string, description: 심각도, enum: [minor, major, critical]}

  - id: sales
    name: 영업
    version: 0.1.0
    stage: 3
    owner_unit: sales
    description: 견적 초안 쓰기와 조회, 품목·고객사 찾기, 영업 규정 질의를 맡습니다. 견적 발행은 영업 담당자가 erp 화면에서 합니다.
    callable_by:
      roles: [sales_staff]
    tools:
      - quote_draft
      - quote_list
      - quote_get
      - item_search
      - customer_search
      - policy_search
    allowed_risk: [read, reversible_write]
    doc_scopes: [public, sales-policy]
    model_policy:
      mode: external_allowed
      reason: 견적은 기밀이 아닙니다. 고객 담당자 개인정보는 gateway가 가립니다.
    risk_policy:
      read: auto
      reversible_write: auto_with_undo
      irreversible: deny
    routing:
      keywords: [견적, 고객사, 영업, 수주, 견적서]
      examples:
        - 가온테크에 평기어 GR-M2-40 50개 견적 초안 써 줘
        - 이번 달 내가 쓴 견적 목록 보여 줘

