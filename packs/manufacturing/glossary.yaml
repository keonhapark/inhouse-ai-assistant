# 사내 용어 사전(선택). gateway가 외부 LLM 요청의 기밀 여부를 판정합니다.
# 모두 지어낸 이름입니다.
terms:
  - term: 프로젝트 오리온
    aliases: [오리온 프로젝트, Project Orion]
    level: confidential
    action: local_only
    reason: 미공개 신규 라인 프로젝트명입니다
  - term: GX-7 하우징
    aliases: [GX7, GX-7]
    level: confidential
    action: local_only
    reason: 개발 중인 제품 코드명입니다
  - term: 납품 단가표
    aliases: [단가표, 납품단가]
    level: confidential
    action: block
    reason: 거래처별 단가는 외부로 보낼 수 없습니다
  - term: 원가 분석
    aliases: [원가분석, 제조원가]
    level: confidential
    action: local_only
    reason: 원가 정보는 사내 모델로만 다룹니다
  - term: 협력사 평가
    aliases: [협력사 평가표]
    level: internal
    action: local_only

# 업무 주제(#304). 인사·근태 정보는 입구 라우터가 외부 허용 에이전트로 잘못 보내도 사내 모델로만 다룹니다.
# 규칙은 정상 셋 시나리오에 대 보고 정했습니다(인사 기대 92건 중 90건, 전사 비서 48건 중 6건이 걸림. 걸린 6건은 대결·인사 공지
# 규정 질문). 확인 셋으로 다시 봐야 합니다.
topics:
  - id: hr-attendance
    action: local_only
    reason: 인사·근태 정보(휴가·병가·대결·급여 등)는 사내 모델로만 다룹니다
    patterns:
      - 병가|연차|연가|반차|휴가|조퇴|결근|근태
      - 대결
      - 결재.{0,40}(맡겨|맡길|위임)
      - 급여|기본급|연봉|입사일|인사 ?공지|인사 ?평가
