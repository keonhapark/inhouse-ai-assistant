# 외부 LLM 비용 상한(선택). gateway가 LiteLLM이 계산한 비용(USD)을 기간마다 누적하고,
# 상한을 넘으면 다음 요청부터 외부 요청을 로컬 모델로 내립니다(진행 중 요청은 끝까지).
# 부서 상한은 요청한 직원의 소속 부서와 그 상위 부서에 모두 더합니다.
period: month
agents:
  assistant: 20
  hr: 0          # 인사는 local_only라 외부를 쓰지 않습니다(정책과 같게 0)
units:
  mgmt: 15
  sales-div: 15
  production-div: 15
  rnd-center: 0  # 연구 기밀 부서는 외부를 쓰지 않습니다
  it-ops: 10
