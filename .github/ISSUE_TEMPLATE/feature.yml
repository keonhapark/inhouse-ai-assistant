name: 기능
description: 모듈 하나에서 할 일
labels: [feature]
body:
  - type: textarea
    id: background
    attributes:
      label: 배경
      description: 왜 필요한지
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: 완료 조건
      description: 확인할 수 있는 조건(시험, 계약, 측정)
      value: "- [ ] "
    validations:
      required: true
  - type: input
    id: path
    attributes:
      label: 담당 경로
      placeholder: erp/
    validations:
      required: true
  - type: textarea
    id: deps
    attributes:
      label: 의존
      description: 먼저 끝나야 하는 이슈가 있으면 "blocked by #번호"
