# 평가 실행 설정 예시(eval/protocol.md 1·8절). conditions.local.yaml로 복사해서 값만 바꿔 씁니다.

model: qwen3.5:9b        # 보고서에 남길 모델 이름
packStage: 1             # 대상 시스템을 띄운 팩 단계(compose PACK_STAGE). 보고서에 적습니다
tunedSets: [normal]      # 고치는 데 쓴 셋(결정 0005). 정상 셋 v1은 #304·#305 뒤 커밋부터 보호 지표로 쓰지 않습니다
stackCommit: null         # 대상 시스템(compose) 이미지를 빌드한 커밋. 하네스 커밋과 다를 때 적습니다
# stackCheck:               # 띄운 스택이 stackCommit의 소스인지 컨테이너 /repo 파일 해시로 확인(#449). --bundle이면 필수
#   containers: [iaa-s5-agent-1, iaa-s5-gateway-1, iaa-s5-rag-1]   # erp(Java 빌드)는 이 방법으로 확인 못 함
#   mounts:                    # 호스트 작업 트리를 마운트한 경로도 대조(#470)
#   - {container: iaa-s5-litellm-1, path: /cfg, repo: gateway/litellm}
#   env:                       # 판정에 영향이 있는 설정 값을 보고서에 남김. KEY·SECRET·TOKEN·PASSWORD·URL이 든 이름은 받지 않음
#     iaa-s5-gateway-1: [GATEWAY_LOCAL_REASONING_EFFORT, GATEWAY_EVAL_MODE]
#     iaa-s5-rag-1: [RAG_MARKERS_FILE, RAG_EXTRA_DOCS, PACK_STAGE]
repeats: 3
baseSeed: 0              # 회차 시드 = baseSeed + 회차
costCapUsd: 5            # 넘으면 시나리오 경계에서 멈추고 보고서에 일부 실행으로 표시
timeLimitS: 300          # 시나리오 한 회차 시간 제한
httpTimeoutS: 120
# 재시도 가능한 오류가 나면 모델 서버가 살아 있는지 봅니다. 응답이 없을 때만 실행 환경 문제로 보고 다시 돌립니다.
# 빼면 그런 회차도 실패로 셉니다. 주소는 환경 변수 이름으로만 적습니다(eval/protocol.md 2절)
# modelHealth: {urlEnv: OLLAMA_BASE_URL, path: /api/tags}
# 보고서 "모델 설정" 칸에 남길 설정(이름: 값). 모델 교체 회귀(#107)에서는 승인자·기기·reasoning_effort를 적습니다
# modelSettings: {승인자: intent, 기기: RTX 4070 SUPER, local 계획 호출 reasoning_effort: none}
notes:                   # 보고서 실행 정보에 그대로 적을 말(프로토콜과 다르게 돌린 이유 등)
  - 예: 반복 수를 바꾼 이유는 docs/decisions/NNNN에 있습니다

rag:
  container: iaa-s5-rag-1   # 주입 문서 파일(RAG_EXTRA_DOCS)이 켜져 있는지 docker exec로 봅니다(--injected-docs)

erp:
  baseUrl: http://localhost:8540/api/v1   # S5 erp(PORT_BASE+40)
  reset: true            # 회차마다 POST /_eval/reset. erp를 ERP_EVAL_RESET=1로 띄워야 합니다

gateway:
  baseUrl: http://localhost:8510/api      # GATEWAY_EVAL_MODE=1로 띄워야 X-Eval-Condition을 받습니다
  auditor: E0057         # 감사 조회 역할 직원(팩 org.yaml의 auditor)
  externalLog: /tmp/iaa-s5-external-requests.jsonl   # gateway의 GATEWAY_EXTERNAL_LOG와 같은 파일(호스트에서 보일 때)
  # 기록이 compose 볼륨 안에만 있으면 대신 아래를 씁니다
  # externalLogDocker: {container: iaa-s5-gateway-1, path: /audit/external.jsonl}
  # 모델 교체 회귀(#107·#346): 대화를 열 때 X-Eval-Model-Override로 별칭을 바꿔 끼웁니다(GATEWAY_EVAL_MODE=1).
  # local=local-exaone | external=external-sonnet | local=local-exaone,external=external-sonnet. 빼면 기본 별칭.
  # 바꿔 끼운 회차는 다른 출력 이름으로 돌립니다(--resume은 값이 다르면 멈춤)
  # modelOverride: local=local-exaone
  conditions:            # 조건 ID는 agent 계약 Condition
    - no_guard
    - write_blocked
    - approve_all
    - baseline_tools
    - full
    # - full_always_approve   # 결정 0006 민감도 분석: 장치는 full, 승인자만 항상 승인(확인 셋·정상 셋 v2)
