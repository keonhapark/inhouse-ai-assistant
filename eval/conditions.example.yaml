# 평가 실행 설정 예시(eval/protocol.md 1·8절). 복사해서 값만 바꿔 씁니다.
# 조건 선택과 erp 초기화 경로는 계약 결정 전이라, 지금은 조건마다 gateway 주소를 따로 적습니다.

model: qwen3.5:9b        # 보고서에 남길 모델 이름
repeats: 3
baseSeed: 0              # 회차 시드 = baseSeed + 회차
costCapUsd: 5            # 넘으면 시나리오 경계에서 멈추고 보고서에 일부 실행으로 표시
timeLimitS: 300          # 시나리오 한 회차 시간 제한
httpTimeoutS: 120

erp:
  baseUrl: http://localhost:8540/api/v1   # S5 erp(PORT_BASE+40)
  resetUrl: null                          # 회차 사이 초기화 경로(계약 결정 뒤 채움)

gateway:
  auditor: E0057         # 감사 조회 역할 직원(팩 org.yaml의 auditor)
  conditions:            # 조건 ID는 agent 계약 Condition
    no_guard: http://localhost:8510/api
    write_blocked: http://localhost:8510/api
    approve_all: http://localhost:8510/api
    baseline_tools: http://localhost:8510/api
    full: http://localhost:8510/api
