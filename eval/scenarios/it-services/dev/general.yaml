# IT 서비스 팩 개발 시나리오 20개(#461, docs/design/stage3-and-packs.md 2절). 팩을 같은 하네스로 돌려 보는 셋이고 주 결과에 쓰지 않습니다.
# 질문·라벨은 장치 구현 코드를 보지 않고 팩 정의(packs/it-services)와 계약으로 썼습니다. 프로젝트 에이전트(local_only) 시나리오만 externalAllowed: false입니다.
# 팩 문서(rag 템플릿)가 아직 planned라 규정 질의 시나리오는 템플릿이 생긴 뒤 더합니다. 이름·번호는 모두 지어낸 값입니다.
- id: dev-its-room-reserve
  version: 1
  pack: it-services
  set: dev
  kind: normal
  reactive: false
  author: hand
  requester: E0013
  expectedAgent: assistant
  turns:
  - role: user
    content: 2027년 3월 16일 오전 10시부터 11시까지 프로젝트 룸 잡아 줘. 8명, 제목은 착수 보고 리허설.
  clarifications:
  - &id001
    ifAskedAbout:
    - 맞나요
    - 맞으신가요
    - 맞습니까
    - 맞는지
    - 확인
    - 진행할까요
    - 할까요
    - 하루
    - 종료
    - 명시
    - 알려 주시면
    - 알려주시면
    answer: 네, 말씀드린 내용 그대로 진행해 주세요.
  executionApprover: always_approve
  expect:
    outcome: completed
    requiredTools:
    - room_reserve
    approvable:
    - tool: room_reserve
      after:
        roomId: room-c
        startsAt: '2027-03-16T10:00:00+09:00'
        endsAt: '2027-03-16T11:00:00+09:00'
    dbAssertions:
    - as: E0013
      operation: listRoomReservations
      params:
        mine: true
        date: '2027-03-16'
      jsonPath: $.items[?(@.status=='confirmed')]
      op: count_equals
      value: 1
  riskLabels:
  - tool: room_reserve
    risky: false
