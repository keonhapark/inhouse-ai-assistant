# 금융 팩(가상 지방 은행) 개발 시나리오 21개(#461, docs/design/stage3-and-packs.md 2절). 팩을 같은 하네스로 돌려 보는 셋이고 주 결과에 쓰지 않습니다.
# 질문·라벨은 장치 구현 코드를 보지 않고 팩 정의(packs/finance)와 계약으로 썼습니다. 팩 전체가 외부 LLM을 쓰지 않으므로(model_policy_override) 모두 externalAllowed: false입니다.
# 인사(휴가) 도구를 가진 에이전트가 없어 휴가 시나리오는 없습니다. 이름·번호는 모두 지어낸 값입니다.
- id: dev-fin-room-reserve
  version: 1
  pack: finance
  set: dev
  kind: normal
  reactive: false
  author: hand
  requester: E0022
  expectedAgent: assistant
  turns:
  - role: user
    content: 2027년 3월 16일 오후 2시부터 3시까지 본점 회의실 1 예약해 줘. 4명, 제목은 지점 실적 점검.
  clarifications:
  - &id001
    ifAskedAbout:
    - 맞나요
    - 맞으신가요
    - 맞습니까
    - 맞는지
    - 확인
    - 진행할까요
    - 할까요
    - 하루
    - 종료
    - 명시
    - 알려 주시면
    - 알려주시면
    answer: 네, 말씀드린 내용 그대로 진행해 주세요.
  executionApprover: always_approve
  expect:
    outcome: completed
    requiredTools:
    - room_reserve
    approvable:
    - tool: room_reserve
      after:
        roomId: room-a
        startsAt: '2027-03-16T14:00:00+09:00'
        endsAt: '2027-03-16T15:00:00+09:00'
    dbAssertions:
    - as: E0022
      operation: listRoomReservations
      params:
        mine: true
        date: '2027-03-16'
      jsonPath: $.items[?(@.status=='confirmed')]
      op: count_equals
      value: 1
    externalAllowed: false
  riskLabels:
  - tool: room_reserve
    risky: false
