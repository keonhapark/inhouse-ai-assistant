# 로컬 실행. 포트 규칙은 docs/ports.md입니다.
#   기본(가짜 erp + DB):   docker compose -f infra/compose.yaml --env-file .env up -d --wait
#   전체(모듈 이미지 포함): ... --profile full up -d --wait
# 세션마다 COMPOSE_PROJECT_NAME과 SESSION_NO가 달라 포트·DB가 겹치지 않습니다(scripts/env.sh).
name: ${COMPOSE_PROJECT_NAME:-iaa-s0}

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: iaa
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD를 .env에 넣습니다}
      POSTGRES_DB: erp
    ports:
      - "${PORT_POSTGRES:-8060}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iaa -d erp"]
      interval: 3s
      timeout: 3s
      retries: 20

  fake-erp:
    build:
      context: ..
      dockerfile: contracts/Dockerfile
    environment:
      ERP_EVAL_RESET: ${ERP_EVAL_RESET:-}
      ERP_JWT_SECRET: ${ERP_JWT_SECRET:-}
      ERP_DEMO_PASSWORD: ${ERP_DEMO_PASSWORD:-demo}
      DELEGATION_TOKEN_PUBLIC_KEY: /keys/delegation-es256.pub.pem
    volumes:
      - ../infra/dev-keys:/keys:ro
    ports:
      - "${PORT_FAKE_ERP:-8041}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 3s
      timeout: 3s
      retries: 20

  # 아래는 모듈이 Dockerfile을 갖춘 뒤 --profile full로 띄웁니다. 각 모듈은 GET /health(erp는 /api/v1/health)를 둡니다.
  erp:
    profiles: [full]
    build: {context: ../erp}
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/erp
      SPRING_DATASOURCE_USERNAME: iaa
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      PACK_DIR: /packs/manufacturing
      ERP_JWT_SECRET: ${ERP_JWT_SECRET}
      ERP_DEMO_PASSWORD: ${ERP_DEMO_PASSWORD}
      DELEGATION_TOKEN_PUBLIC_KEY: /keys/delegation-es256.pub.pem
      ERP_EVAL_RESET: ${ERP_EVAL_RESET:-}
      ERP_STAGE: ${PACK_STAGE:-}
      ERP_SERVICE_LOGIN_SECRET: ${ERP_SERVICE_LOGIN_SECRET:-}
    volumes:
      - ../packs:/packs:ro
      - ../infra/dev-keys:/keys:ro
    ports:
      - "${PORT_ERP:-8040}:8080"
    depends_on:
      postgres: {condition: service_healthy}

  rag:
    profiles: [full]
    build: {context: .., dockerfile: rag/Dockerfile}
    environment:
      PACK_DIR: /repo/packs/manufacturing
      GATEWAY_LLM_URL: http://gateway:8000/v1
      RAG_EMBED_BASE_URL: http://gateway:8000/v1
      RAG_EMBED_MODEL: local-embed
      DELEGATION_JWKS_URL: http://gateway:8000/api/.well-known/jwks.json
      RAG_AUDIT_LOG: /audit/rag.jsonl
      # 평가 때만 값을 줍니다(예: /eval/markers/dev.yaml). 빈 값은 꺼짐입니다
      RAG_MARKERS_FILE: ${RAG_MARKERS_FILE:-}
      RAG_EXTRA_DOCS: ${RAG_EXTRA_DOCS:-}
    volumes:
      - audit:/audit
      - ../eval/markers:/eval/markers:ro
      - ../eval/injections:/eval/injections:ro
    ports:
      - "${PORT_RAG:-8030}:8000"
    depends_on:
      gateway: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 120s   # 시작 때 문서 임베딩(약 30초)

  agent:
    profiles: [full]
    build: {context: .., dockerfile: agent/Dockerfile}
    environment:
      PACK_DIR: /repo/packs/manufacturing
      GATEWAY_LLM_URL: http://gateway:8000/v1
      ERP_BASE_URL: http://erp:8080/api/v1
      RAG_BASE_URL: http://rag:8000
      DELEGATION_JWKS_URL: http://gateway:8000/api/.well-known/jwks.json
      AGENT_AUDIT_LOG: /audit/agent.jsonl
      AGENT_PACK_STAGE: ${PACK_STAGE:-}
    volumes:
      - audit:/audit
    ports:
      - "${PORT_AGENT:-8020}:8000"
      - "${PORT_MCP:-8021}:8001"

  # LLM 출구. gateway만 부릅니다. 모델 별칭은 gateway/litellm/config.yaml입니다.
  litellm:
    profiles: [full]
    image: python:3.12-slim
    command: ["sh", "-c", "pip install --no-cache-dir -q 'litellm[proxy]==1.108.1' && exec litellm --config /cfg/config.yaml --port 4000"]
    environment:
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?LITELLM_MASTER_KEY를 .env에 넣습니다}
    volumes:
      - ../gateway/litellm:/cfg:ro
    ports:
      - "${PORT_LITELLM:-8050}:4000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:4000/health/liveliness')"]
      interval: 5s
      timeout: 3s
      retries: 60

  gateway:
    profiles: [full]
    build: {context: .., dockerfile: gateway/Dockerfile}
    environment:
      PACK_DIR: /repo/packs/manufacturing
      ERP_BASE_URL: http://erp:8080/api/v1
      AGENT_BASE_URL: http://agent:8000
      LITELLM_BASE_URL: http://litellm:4000
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      DELEGATION_TOKEN_PRIVATE_KEY: /keys/delegation-es256.pem
      GATEWAY_AUDIT_DIR: /audit/gateway
      AUDIT_EVENT_FILES: /audit/agent.jsonl,/audit/rag.jsonl
      GATEWAY_EVAL_MODE: ${GATEWAY_EVAL_MODE:-}
      GATEWAY_EXTERNAL_LOG: ${GATEWAY_EXTERNAL_LOG:-}
      GATEWAY_PACK_STAGE: ${PACK_STAGE:-}
      SLACK_BRIDGE_SECRET: ${SLACK_BRIDGE_SECRET:-}
      SLACK_USERS_FILE: /slack/slack-users.json
      ERP_SERVICE_LOGIN_SECRET: ${ERP_SERVICE_LOGIN_SECRET:-}
    volumes:
      - ../infra/dev-keys:/keys:ro
      - audit:/audit
      - ../infra/slack:/slack:ro
    ports:
      - "${PORT_GATEWAY:-8010}:8000"
    depends_on:
      litellm: {condition: service_healthy}

  web:
    profiles: [full]
    build: {context: ../web}
    environment:
      GATEWAY_URL: http://gateway:8000
    depends_on:
      gateway: {condition: service_healthy}
    ports:
      - "${PORT_WEB:-8000}:80"

  # 슬랙 입구(#102). docker compose --profile full --profile slack up
  slack:
    profiles: [slack]
    build: {context: ../channels/slack}
    environment:
      SLACK_APP_TOKEN: ${SLACK_APP_TOKEN:?SLACK_APP_TOKEN을 .env에 넣습니다}
      SLACK_BOT_TOKEN: ${SLACK_BOT_TOKEN:?SLACK_BOT_TOKEN을 .env에 넣습니다}
      SLACK_BRIDGE_SECRET: ${SLACK_BRIDGE_SECRET:?SLACK_BRIDGE_SECRET을 .env에 넣습니다}
      GATEWAY_URL: http://gateway:8000/api
      WEB_URL: http://localhost:${PORT_WEB:-8000}
    depends_on:
      gateway: {condition: service_healthy}

volumes:
  pgdata:
  audit:
