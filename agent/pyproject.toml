[project]
name = "agent-runtime"
version = "0.1.0"
description = "에이전트 등록부 런타임과 입구 라우터"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.165.0",
  "uvicorn==0.54.0",
  "pyyaml==6.0.3",
  "httpx==0.28.1",
]

[dependency-groups]
dev = [
  "pytest==9.2.0",
  "jsonschema==4.26.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_runtime"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
