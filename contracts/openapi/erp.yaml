openapi: 3.1.0
info:
  title: erp (사내 시스템)
  version: 0.1.0
  description: |
    조직·직원, 결재 문서(양식·결재선·요청·승인·반려·회수), 결재 대결, 근태(휴가), 회의실, 문서 접근 태그를 다룹니다.

    공통 규칙
    - 인증: `Authorization: Bearer <토큰>`. 토큰은 erp가 발급한 직원 JWT이거나 gateway가 발급한 위임 토큰입니다
      (`contracts/auth/delegation-token.schema.json`). 위임 토큰이면 erp는 "토큰 주인의 권한 ∩ 토큰 scopes"로 판단합니다.
    - 각 operation의 `x-required-scope`는 위임 토큰에 있어야 하는 scope입니다. 직원 JWT는 모든 scope를 가진 것으로 봅니다.
      `approval:request`는 양식별로 좁힐 수 있습니다: 토큰에 `approval:request:<formId>`가 있으면 그 양식만 상신합니다.
      scope 목록은 `contracts/auth/scopes.json`입니다. 없는 scope면 403 scope-missing.
    - `x-human-only: true`인 operation은 위임 토큰으로 부를 수 없습니다(403 `delegation-token-not-allowed`). MCP 도구로 노출하지 않습니다.
    - 쓰기(`x-write: true`)는 모두 `?dryRun=true`(미리보기, 상태 불변, 200 `WritePreview`)를 받습니다.
      실제 실행은 `Idempotency-Key`가 필요하고 201 `ActionResult`를 돌려줍니다. 같은 키·같은 본문이면 처음 응답을 그대로,
      같은 키·다른 본문이면 422 `idempotency-key-reused`입니다. 키는 24시간 보관합니다.
    - 실행된 쓰기는 `actionId`를 갖고, `undoable`이면 `POST /actions/{actionId}/undo`로 되돌립니다. 되돌릴 수 없는 상태면 409입니다. 부분 되돌리기는 없습니다.
    - 오류는 RFC 9457 `application/problem+json`이고 `type`은 `urn:problem:<코드>`입니다(아래 `ProblemCode`).
    - 시각은 RFC 3339(오프셋 포함), 날짜는 `YYYY-MM-DD`, 금액은 원 단위 정수입니다.
    - 모든 쓰기는 감사 이벤트(`contracts/events/audit.schema.json`)를 남깁니다.
servers:
  - url: http://localhost:{port}/api/v1
    variables:
      port:
        default: "8040"
        description: PORT_BASE + 40 (docs/ports.md)
security:
  - bearer: []
tags:
  - name: auth
  - name: org
  - name: forms
  - name: approvals
  - name: delegations
  - name: leave
  - name: rooms
  - name: access
  - name: actions
  - name: notifications
  - name: audit
  - name: health

paths:
  /health:
    get:
      tags: [health]
      operationId: health
      security: []
      responses:
        "200":
          description: 살아 있음
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: {const: ok}

  /auth/login:
    post:
      tags: [auth]
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [employeeNo, password]
              additionalProperties: false
              properties:
                employeeNo: {type: string, examples: [E0010]}
                password: {type: string}
      responses:
        "200":
          description: 직원 JWT
          content:
            application/json:
              schema: {$ref: "#/components/schemas/LoginResponse"}
        "401": {$ref: "#/components/responses/Problem"}

  /me:
    get:
      tags: [org]
      operationId: getMe
      x-required-scope: profile:read
      responses:
        "200":
          description: 토큰 주인
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Employee"}
        "401": {$ref: "#/components/responses/Problem"}

  /me/access-tags:
    get:
      tags: [access]
      operationId: getMyAccessTags
      x-required-scope: profile:read
      description: 토큰 주인이 읽을 수 있는 문서 접근 태그(org.yaml `access_tags`)입니다. rag의 ACL과 같은 태그입니다.
      responses:
        "200":
          description: 태그 목록
          content:
            application/json:
              schema:
                type: object
                required: [employeeId, tags]
                properties:
                  employeeId: {type: string}
                  tags:
                    type: array
                    items: {type: string}

  /org/units:
    get:
      tags: [org]
      operationId: listUnits
      x-required-scope: org:read
      responses:
        "200":
          description: 본부·팀
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: "#/components/schemas/Unit"}

  /employees:
    get:
      tags: [org]
      operationId: searchEmployees
      x-required-scope: org:read
      description: 이름·팀으로 직원 찾기. 공개 필드(이름, 팀, 직급)만 돌려줍니다.
      parameters:
        - {name: q, in: query, schema: {type: string}, description: 이름 일부}
        - {name: unitId, in: query, schema: {type: string}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
      responses:
        "200":
          description: 직원 목록
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: "#/components/schemas/EmployeeSummary"}

  /employees/{employeeId}:
    get:
      tags: [org]
      operationId: getEmployee
      x-required-scope: org:read
      description: 본인, 인사 담당(hr_staff)은 전체 필드, 그 밖에는 공개 필드만 돌려줍니다.
      parameters:
        - $ref: "#/components/parameters/EmployeeId"
      responses:
        "200":
          description: 직원
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/Employee"
                  - $ref: "#/components/schemas/EmployeeSummary"
        "404": {$ref: "#/components/responses/Problem"}

  /approval-forms:
    get:
      tags: [forms]
      operationId: listApprovalForms
      x-required-scope: approval:read
      description: 팩 forms.yaml에서 적재한 양식 중 이 erp에서 켜진 것입니다.
      responses:
        "200":
          description: 양식
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: "#/components/schemas/ApprovalForm"}

  /approval-documents:
    get:
      tags: [approvals]
      operationId: listApprovalDocuments
      x-required-scope: approval:read
      parameters:
        - name: box
          in: query
          required: true
          description: |
            outbox: 내가 올린 것. inbox: 지금 내 차례인 것. delegated: 대결로 지금 내가 결재할 수 있는 것(유효한 위임만).
            done: 내가 결재한 것.
          schema:
            type: string
            enum: [outbox, inbox, delegated, done]
        - {name: status, in: query, schema: {$ref: "#/components/schemas/ApprovalStatus"}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
      responses:
        "200":
          description: 결재 문서
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: "#/components/schemas/ApprovalDocument"}
    post:
      tags: [approvals]
      operationId: createApprovalDocument
      summary: 결재 요청(상신)
      x-write: true
      x-required-scope: approval:request
      x-undo: 아직 아무도 결재하지 않았으면 회수와 같은 효과(상태 withdrawn). 결재가 하나라도 있으면 409 undo-conflict
      parameters:
        - $ref: "#/components/parameters/DryRun"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [formId, fields]
              additionalProperties: false
              properties:
                formId: {type: string, examples: [leave]}
                title: {type: string, maxLength: 100}
                fields:
                  type: object
                  description: 양식의 fields 스키마를 따릅니다. 어기면 422 form-validation-failed
      responses:
        "200": {$ref: "#/components/responses/WritePreview"}
        "201": {$ref: "#/components/responses/ActionResult"}
        "403": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}

  /approval-documents/{documentId}:
    get:
      tags: [approvals]
      operationId: getApprovalDocument
      x-required-scope: approval:read
      description: 요청자, 결재선에 있는 사람, 그 결재자의 유효한 대리인만 볼 수 있습니다. 그 밖에는 404.
      parameters:
        - $ref: "#/components/parameters/DocumentId"
      responses:
        "200":
          description: 결재 문서
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ApprovalDocument"}
        "404": {$ref: "#/components/responses/Problem"}

  /approval-documents/{documentId}/approve:
    post:
      tags: [approvals]
      operationId: approveApprovalDocument
      summary: 결재 승인(사람 화면 전용)
      x-write: true
      x-human-only: true
      x-required-scope: approval:decide
      x-undo: 되돌릴 수 없습니다(undoable false).
      description: |
        현재 단계 결재자 본인이거나, 그 결재자가 등록한 유효한 대결 위임의 대리인이어야 합니다.
        대리인이면 erp는 그 시점의 위임 기간과 범위(양식·금액)를 보고, 결재 기록에 원 결재자와 위임 ID를 남기며,
        원 결재자에게 후열 알림을 만듭니다. 위임의 위임(재위임)은 따라가지 않습니다.
        요청자 본인은 어떤 경로로도 결재할 수 없습니다(self-approval-forbidden).
        `version`이 현재와 다르면 409 version-conflict(원 결재자와 대리인 동시 결재 포함).
      parameters:
        - $ref: "#/components/parameters/DocumentId"
        - $ref: "#/components/parameters/DryRun"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/DecisionRequest"}
      responses:
        "200": {$ref: "#/components/responses/WritePreview"}
        "201": {$ref: "#/components/responses/ActionResult"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}

  /approval-documents/{documentId}/reject:
    post:
      tags: [approvals]
      operationId: rejectApprovalDocument
      summary: 결재 반려(사람 화면 전용)
      x-write: true
      x-human-only: true
      x-required-scope: approval:decide
      x-undo: 되돌릴 수 없습니다(undoable false).
      description: 결재 자격 판단은 approve와 같습니다.
      parameters:
        - $ref: "#/components/parameters/DocumentId"
        - $ref: "#/components/parameters/DryRun"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/DecisionRequest"}
      responses:
        "200": {$ref: "#/components/responses/WritePreview"}
        "201": {$ref: "#/components/responses/ActionResult"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}

  /approval-documents/{documentId}/withdraw:
    post:
      tags: [approvals]
      operationId: withdrawApprovalDocument
      summary: 회수(요청자 본인)
      x-write: true
      x-required-scope: approval:withdraw
      x-undo: 되돌릴 수 없습니다(undoable false). 다시 올리려면 새로 상신합니다.
      description: |
        요청자 본인만 합니다. 진행 중(in_progress)이면 회수합니다. 최종 승인된 휴가는 시작일 전이면 회수하고 잔여를 돌려놓습니다.
        반려·회수된 문서와 시작일이 지난 승인 문서는 409 invalid-state.
      parameters:
        - $ref: "#/components/parameters/DocumentId"
        - $ref: "#/components/parameters/DryRun"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                reason: {type: string, maxLength: 200}
      responses:
        "200": {$ref: "#/components/responses/WritePreview"}
        "201": {$ref: "#/components/responses/ActionResult"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}

  /delegations:
    get:
      tags: [delegations]
      operationId: listDelegations
      x-required-scope: delegation:read
      parameters:
        - name: role
          in: query
          required: true
          description: delegator는 내가 맡긴 것, delegate는 내가 맡은 것. all은 인사 담당만(그 밖에는 403).
          schema: {type: string, enum: [delegator, delegate, all]}
        - name: activeAt
          in: query
          description: 이 시각에 유효한 것만
          schema: {type: string, format: date-time}
      responses:
        "200":
          description: 위임 목록
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: "#/components/schemas/Delegation"}
        "403": {$ref: "#/components/responses/Problem"}
    post:
      tags: [delegations]
      operationId: createDelegation
      summary: 대결 위임 등록
      x-write: true
      x-required-scope: delegation:write
      x-undo: 해지와 같은 효과. 위임으로 이미 결재한 건이 있으면 409 undo-conflict
      description: |
        위임자 본인이 하거나, 인사 담당이 `delegatorId`를 지정해 합니다. 그 밖에는 403 delegation-registrar-forbidden.
        검사: 대리인 ≠ 위임자(422 delegation-self), 기간 시작 < 끝(422 validation), 기간 ≤ 팩 max_period_days(422 delegation-period-too-long),
        끝이 과거면 422 validation, formTypes는 양식 ID(422 validation).
        위임자가 결재선에 없는 사람이어도 등록은 됩니다(쓸 일이 없을 뿐).
      parameters:
        - $ref: "#/components/parameters/DryRun"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/DelegationCreate"}
      responses:
        "200": {$ref: "#/components/responses/WritePreview"}
        "201": {$ref: "#/components/responses/ActionResult"}
        "403": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}

  /delegations/{delegationId}:
    get:
      tags: [delegations]
      operationId: getDelegation
      x-required-scope: delegation:read
      parameters:
        - $ref: "#/components/parameters/DelegationId"
      responses:
        "200":
          description: 위임
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Delegation"}
        "404": {$ref: "#/components/responses/Problem"}

  /delegations/{delegationId}/revoke:
    post:
      tags: [delegations]
      operationId: revokeDelegation
      summary: 대결 위임 해지
      x-write: true
      x-required-scope: delegation:write
      x-undo: 되돌릴 수 없습니다(undoable false). 다시 등록합니다.
      description: 위임자 본인이나 인사 담당만 합니다. 이미 해지됐거나 끝났으면 409 invalid-state.
      parameters:
        - $ref: "#/components/parameters/DelegationId"
        - $ref: "#/components/parameters/DryRun"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200": {$ref: "#/components/responses/WritePreview"}
        "201": {$ref: "#/components/responses/ActionResult"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}

  /delegations/{delegationId}/acted-documents:
    get:
      tags: [delegations]
      operationId: listDelegationActedDocuments
      x-required-scope: delegation:read
      description: 이 위임으로 대리인이 결재한 문서(후열 확인용). 위임자, 대리인, 인사 담당만.
      parameters:
        - $ref: "#/components/parameters/DelegationId"
      responses:
        "200":
          description: 문서
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: "#/components/schemas/ApprovalDocument"}

  /leave/balance:
    get:
      tags: [leave]
      operationId: getLeaveBalance
      x-required-scope: leave:read
      parameters:
        - name: employeeId
          in: query
          description: 생략하면 본인. 다른 사람은 인사 담당만(그 밖에는 403).
          schema: {type: string}
      responses:
        "200":
          description: 연차 잔여
          content:
            application/json:
              schema: {$ref: "#/components/schemas/LeaveBalance"}
        "403": {$ref: "#/components/responses/Problem"}

  /rooms:
    get:
      tags: [rooms]
      operationId: listRooms
      x-required-scope: room:read
      parameters:
        - {name: minCapacity, in: query, schema: {type: integer, minimum: 1}}
      responses:
        "200":
          description: 회의실
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: "#/components/schemas/Room"}

  /rooms/availability:
    get:
      tags: [rooms]
      operationId: getRoomAvailability
      x-required-scope: room:read
      description: 주어진 시간대에 비어 있는 회의실
      parameters:
        - {name: startsAt, in: query, required: true, schema: {type: string, format: date-time}}
        - {name: endsAt, in: query, required: true, schema: {type: string, format: date-time}}
        - {name: minCapacity, in: query, schema: {type: integer, minimum: 1}}
      responses:
        "200":
          description: 빈 회의실
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: "#/components/schemas/Room"}
        "422": {$ref: "#/components/responses/Problem"}

  /room-reservations:
    get:
      tags: [rooms]
      operationId: listRoomReservations
      x-required-scope: room:read
      parameters:
        - name: mine
          in: query
          schema: {type: boolean, default: true}
        - {name: roomId, in: query, schema: {type: string}}
        - {name: date, in: query, schema: {type: string, format: date}}
      responses:
        "200":
          description: 예약
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: "#/components/schemas/RoomReservation"}
    post:
      tags: [rooms]
      operationId: createRoomReservation
      summary: 회의실 예약
      x-write: true
      x-required-scope: room:write
      x-undo: 예약 취소와 같은 효과. 시작 시각이 지났으면 409 undo-conflict
      description: |
        30분 단위(정각·30분), 같은 날 안, 최대 4시간. 어기면 422 validation.
        같은 회의실·겹치는 시간에 확정 예약이 있으면 409 room-conflict(동시 요청 둘 중 하나만 성공).
      parameters:
        - $ref: "#/components/parameters/DryRun"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [roomId, startsAt, endsAt, title]
              additionalProperties: false
              properties:
                roomId: {type: string}
                startsAt: {type: string, format: date-time}
                endsAt: {type: string, format: date-time}
                title: {type: string, maxLength: 100}
                attendees: {type: integer, minimum: 1}
      responses:
        "200": {$ref: "#/components/responses/WritePreview"}
        "201": {$ref: "#/components/responses/ActionResult"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}

  /room-reservations/{reservationId}/cancel:
    post:
      tags: [rooms]
      operationId: cancelRoomReservation
      summary: 회의실 예약 취소(예약자 본인)
      x-write: true
      x-required-scope: room:write
      x-undo: 같은 시간대가 아직 비어 있으면 예약을 되살립니다. 다른 예약이 들어왔으면 409 undo-conflict
      parameters:
        - {name: reservationId, in: path, required: true, schema: {type: string}}
        - $ref: "#/components/parameters/DryRun"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200": {$ref: "#/components/responses/WritePreview"}
        "201": {$ref: "#/components/responses/ActionResult"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}

  /actions/{actionId}:
    get:
      tags: [actions]
      operationId: getAction
      x-required-scope: action:read
      description: 행동을 한 사람(위임 토큰이면 그 토큰의 주인)만 볼 수 있습니다.
      parameters:
        - $ref: "#/components/parameters/ActionId"
      responses:
        "200":
          description: 행동
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Action"}
        "404": {$ref: "#/components/responses/Problem"}

  /actions/{actionId}/undo:
    post:
      tags: [actions]
      operationId: undoAction
      summary: 되돌리기
      x-write: true
      x-required-scope: action:undo
      x-undo: 되돌리기의 되돌리기는 없습니다.
      description: |
        행동을 한 사람만 합니다. 두 번째 호출은 409 already-undone. undoable이 아니면 409 not-undoable.
        상태가 바뀌어 되돌릴 수 없으면 409 undo-conflict(무엇이 막는지 detail에 적음). 부분 되돌리기는 없습니다.
      parameters:
        - $ref: "#/components/parameters/ActionId"
        - $ref: "#/components/parameters/DryRun"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200": {$ref: "#/components/responses/WritePreview"}
        "201": {$ref: "#/components/responses/ActionResult"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}

  /notifications:
    get:
      tags: [notifications]
      operationId: listNotifications
      x-required-scope: notification:read
      description: 후열(대결 결재 내역), 결재 차례, 결과 알림
      parameters:
        - {name: unreadOnly, in: query, schema: {type: boolean, default: false}}
      responses:
        "200":
          description: 알림
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: "#/components/schemas/Notification"}

  /audit-events:
    get:
      tags: [audit]
      operationId: listAuditEvents
      x-human-only: true
      x-required-scope: audit:read
      description: auditor 역할만. erp가 남긴 감사 이벤트입니다.
      parameters:
        - {name: actorId, in: query, schema: {type: string}}
        - {name: actionId, in: query, schema: {type: string}}
        - {name: since, in: query, schema: {type: string, format: date-time}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 500, default: 100}}
      responses:
        "200":
          description: 감사 이벤트
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: "../events/audit.schema.json"}
        "403": {$ref: "#/components/responses/Problem"}

  /_eval/reset:
    post:
      tags: [eval]
      operationId: evalReset
      security: []
      description: >-
        평가 전용. ERP_EVAL_RESET=1로 띄웠을 때만 있습니다(아니면 404). 모든 상태를 팩 고정 데이터로 되돌리고
        멱등 키·되돌리기 기록·감사 이벤트도 비웁니다. 평가 회차 사이에 부릅니다.
      responses:
        "204":
          description: 초기화함
        "404": {$ref: "#/components/responses/Problem"}

components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    DryRun:
      name: dryRun
      in: query
      description: true면 상태를 바꾸지 않고 미리보기(200 WritePreview)만 돌려줍니다. 검사 오류는 실행과 같이 냅니다.
      schema: {type: boolean, default: false}
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      description: 실행(dryRun 아님)에 필요합니다. 없으면 400 idempotency-key-required. 8~128자.
      schema: {type: string, minLength: 8, maxLength: 128}
    EmployeeId:
      name: employeeId
      in: path
      required: true
      schema: {type: string}
    DocumentId:
      name: documentId
      in: path
      required: true
      schema: {type: string}
    DelegationId:
      name: delegationId
      in: path
      required: true
      schema: {type: string}
    ActionId:
      name: actionId
      in: path
      required: true
      schema: {type: string}

  responses:
    Problem:
      description: RFC 9457 오류
      content:
        application/problem+json:
          schema: {$ref: "#/components/schemas/Problem"}
    WritePreview:
      description: dryRun 미리보기. 상태는 바뀌지 않았습니다.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/WritePreview"}
    ActionResult:
      description: 실행됨
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ActionResult"}

  schemas:
    ProblemCode:
      type: string
      enum:
        - unauthorized
        - forbidden
        - scope-missing
        - delegation-token-not-allowed
        - not-found
        - validation
        - form-validation-failed
        - idempotency-key-required
        - idempotency-key-reused
        - version-conflict
        - invalid-state
        - not-current-approver
        - self-approval-forbidden
        - delegation-not-found
        - delegation-out-of-period
        - delegation-out-of-scope
        - delegation-revoked
        - redelegation-not-allowed
        - delegation-self
        - delegation-period-too-long
        - delegation-registrar-forbidden
        - leave-balance-insufficient
        - room-conflict
        - not-undoable
        - already-undone
        - undo-conflict

    Problem:
      type: object
      required: [type, title, status]
      properties:
        type:
          type: string
          pattern: "^urn:problem:[a-z-]+$"
          description: urn:problem:<ProblemCode>
        title: {type: string}
        status: {type: integer}
        detail: {type: string}
        instance: {type: string}
        errors:
          type: array
          description: 검사 오류(validation, form-validation-failed)
          items:
            type: object
            required: [field, message]
            properties:
              field: {type: string}
              message: {type: string}

    LoginResponse:
      type: object
      required: [accessToken, tokenType, expiresIn, employee]
      properties:
        accessToken: {type: string}
        tokenType: {const: Bearer}
        expiresIn: {type: integer, description: 초}
        employee: {$ref: "#/components/schemas/Employee"}

    EmployeeSummary:
      type: object
      required: [id, name, unitId, unitName, grade]
      properties:
        id: {type: string}
        name: {type: string}
        unitId: {type: string}
        unitName: {type: string}
        grade: {type: string, description: org.yaml grades의 id}

    Employee:
      allOf:
        - $ref: "#/components/schemas/EmployeeSummary"
        - type: object
          required: [employeeNo, email, roles, hiredOn]
          properties:
            employeeNo: {type: string}
            email: {type: string}
            roles:
              type: array
              items: {type: string}
            hiredOn: {type: string, format: date}

    Unit:
      type: object
      required: [id, name, kind]
      properties:
        id: {type: string}
        name: {type: string}
        kind: {type: string, enum: [division, team]}
        parentId: {type: [string, "null"]}
        headId: {type: [string, "null"], description: 팀장·본부장·대표이사 직원 ID}

    ApprovalForm:
      type: object
      required: [id, name, fieldsSchema]
      properties:
        id: {type: string}
        name: {type: string}
        fieldsSchema: {type: object, description: JSON Schema}
        amountField: {type: [string, "null"]}

    ApprovalStatus:
      type: string
      enum: [in_progress, approved, rejected, withdrawn]

    ApprovalStep:
      type: object
      required: [order, approverId, status]
      properties:
        order: {type: integer, minimum: 1}
        approverId: {type: string, description: 결재선의 원 결재자}
        status: {type: string, enum: [waiting, pending, approved, rejected, skipped]}
        actedBy: {type: [string, "null"], description: 실제로 결재한 사람. 대리인이면 원 결재자와 다릅니다}
        onBehalfOf: {type: [string, "null"], description: 대결이면 원 결재자 ID}
        delegationId: {type: [string, "null"]}
        actedAt: {type: [string, "null"], format: date-time}
        comment: {type: [string, "null"]}

    ApprovalDocument:
      type: object
      required: [id, formId, title, requesterId, status, fields, steps, currentStep, version, createdAt]
      properties:
        id: {type: string}
        formId: {type: string}
        title: {type: string}
        requesterId: {type: string}
        status: {$ref: "#/components/schemas/ApprovalStatus"}
        fields: {type: object}
        amount: {type: [integer, "null"]}
        steps:
          type: array
          items: {$ref: "#/components/schemas/ApprovalStep"}
        currentStep: {type: [integer, "null"], description: 진행 중이면 지금 단계 order}
        version: {type: integer, description: 낙관적 락 버전}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}

    DecisionRequest:
      type: object
      required: [version]
      additionalProperties: false
      properties:
        version: {type: integer, description: 화면이 본 문서 version}
        comment: {type: string, maxLength: 200}

    DelegationScope:
      type: object
      required: [formTypes]
      additionalProperties: false
      properties:
        formTypes:
          type: array
          minItems: 1
          description: 양식 ID 목록. ["*"]이면 모든 양식
          items: {type: string}
        maxAmount:
          type: [integer, "null"]
          minimum: 0
          description: 이 금액 이하 문서만. null이면 한도 없음. 금액이 없는 양식에는 적용하지 않습니다

    DelegationCreate:
      type: object
      required: [delegateId, startsAt, endsAt, scope, reason]
      additionalProperties: false
      properties:
        delegatorId: {type: string, description: 인사 담당이 다른 사람 대신 등록할 때만. 생략하면 본인}
        delegateId: {type: string}
        startsAt: {type: string, format: date-time}
        endsAt: {type: string, format: date-time}
        scope: {$ref: "#/components/schemas/DelegationScope"}
        reason: {type: string, maxLength: 200}

    Delegation:
      type: object
      required: [id, delegatorId, delegateId, startsAt, endsAt, scope, reason, status, registeredBy, createdAt]
      properties:
        id: {type: string}
        delegatorId: {type: string}
        delegateId: {type: string}
        startsAt: {type: string, format: date-time}
        endsAt: {type: string, format: date-time}
        scope: {$ref: "#/components/schemas/DelegationScope"}
        reason: {type: string}
        status:
          type: string
          enum: [scheduled, active, expired, revoked]
          description: 조회 시각 기준으로 계산합니다
        registeredBy: {type: string}
        revokedAt: {type: [string, "null"], format: date-time}
        revokedBy: {type: [string, "null"]}
        createdAt: {type: string, format: date-time}

    LeaveBalance:
      type: object
      required: [employeeId, year, annualTotal, annualUsed, annualPending, annualRemaining]
      properties:
        employeeId: {type: string}
        year: {type: integer}
        annualTotal: {type: number}
        annualUsed: {type: number, description: 최종 승인된 것}
        annualPending: {type: number, description: 진행 중인 결재}
        annualRemaining: {type: number, description: total - used - pending}

    Room:
      type: object
      required: [id, name, floor, capacity]
      properties:
        id: {type: string}
        name: {type: string}
        floor: {type: integer}
        capacity: {type: integer}

    RoomReservation:
      type: object
      required: [id, roomId, reservedBy, startsAt, endsAt, title, status]
      properties:
        id: {type: string}
        roomId: {type: string}
        reservedBy: {type: string}
        startsAt: {type: string, format: date-time}
        endsAt: {type: string, format: date-time}
        title: {type: string}
        attendees: {type: [integer, "null"]}
        status: {type: string, enum: [confirmed, cancelled]}

    Change:
      type: object
      required: [op, resource]
      properties:
        op: {type: string, enum: [create, update, delete]}
        resource: {type: string, description: "예: approval_document, delegation, room_reservation, leave_balance"}
        resourceId: {type: [string, "null"], description: 미리보기에서 새로 만들 것은 null}
        before: {type: [object, "null"]}
        after: {type: [object, "null"]}

    WritePreview:
      type: object
      required: [dryRun, operation, summary, changes, undoable]
      properties:
        dryRun: {const: true}
        operation: {type: string, description: operationId}
        summary: {type: string, description: 사람이 읽을 한 줄(한국어)}
        changes:
          type: array
          items: {$ref: "#/components/schemas/Change"}
        undoable: {type: boolean}
        warnings:
          type: array
          items: {type: string}

    ActionResult:
      type: object
      required: [actionId, operation, summary, changes, undoable, resource]
      properties:
        actionId: {type: string}
        operation: {type: string}
        summary: {type: string}
        changes:
          type: array
          items: {$ref: "#/components/schemas/Change"}
        undoable: {type: boolean}
        resource:
          type: object
          description: 실행 뒤 대상 리소스(ApprovalDocument, Delegation, RoomReservation 등). undo면 되돌린 뒤 상태
        undoOf: {type: [string, "null"], description: undo 행동이면 원래 actionId}

    Action:
      type: object
      required: [id, operation, actorId, status, undoable, createdAt]
      properties:
        id: {type: string}
        operation: {type: string}
        actorId: {type: string}
        viaDelegationToken: {type: boolean}
        agentId: {type: [string, "null"]}
        conversationId: {type: [string, "null"]}
        resourceType: {type: string}
        resourceId: {type: string}
        status: {type: string, enum: [done, undone]}
        undoable: {type: boolean}
        undoActionId: {type: [string, "null"]}
        createdAt: {type: string, format: date-time}

    Notification:
      type: object
      required: [id, kind, message, createdAt, read]
      properties:
        id: {type: string}
        kind: {type: string, enum: [approval_turn, approval_result, delegated_decision, delegation_registered]}
        message: {type: string}
        documentId: {type: [string, "null"]}
        delegationId: {type: [string, "null"]}
        createdAt: {type: string, format: date-time}
        read: {type: boolean}
