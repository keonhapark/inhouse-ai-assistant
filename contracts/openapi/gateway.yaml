openapi: 3.1.0
info:
  title: gateway (출구와 화면용 API)
  version: 0.1.0
  description: |
    web 화면이 부르는 유일한 서버입니다. 직원은 erp JWT로 로그인하고, gateway는 대화마다 위임 토큰(10분, ES256)을 발급해
    agent에 넘깁니다. 결재함·대결·되돌리기는 직원 JWT로 erp를 그대로 부릅니다(사람 화면 경로).

    용어
    - 실행 승인(`approvalId`): 에이전트가 위험 등급 confirm인 도구를 실행하기 전에 요청자 본인에게 받는 확인입니다.
    - 결재(`documentId`): erp 결재 문서. 팀장 승인함에서 승인·반려합니다. 에이전트는 결재 승인 도구가 없습니다.

    LLM 출구
    - `POST /v1/chat/completions` 등 OpenAI 호환 엔드포인트는 gateway가 받아 정책을 확인한 뒤 LiteLLM 프록시로 넘기며, 형식은 OpenAI 호환 그대로라 이 문서에는 적지 않습니다
      (https://docs.litellm.ai). rag·agent는 여기만 부릅니다. 요청에 `X-Delegation-Token`을 붙이면 gateway가 `agt` 클레임으로
      에이전트 모델 정책(local_only 등)을 강제하고, 가림·기밀 판정·외부 전송 기록을 남깁니다.
    - `POST /v1/chat/completions` 응답(스트림이 아닌 것)에는 실제로 보낸 별칭과 위치를 헤더로 붙입니다:
      `X-Egress-Model`(LiteLLM 별칭), `X-Egress-Location`(`local` | `external`). 기밀 용어로 로컬로 돌리거나 외부 장애로
      로컬로 폴백하면 요청한 별칭과 다릅니다. 호출자는 기록(`model.location`, 감사 `externalSent`)에 이 값을 씁니다.
    - 이미지 입력(#261): `messages[].content`에 OpenAI 호환 `image_url` 부분이 있으면, 요청한 별칭·에이전트 모델 정책과
      관계없이 로컬 비전 별칭 `local-vision`으로만 보냅니다(외부로 보내지 않음). 이미지는 `data:image/jpeg;base64,…` 또는
      `data:image/png;base64,…` data URL만 받고, 한 장의 디코딩 크기 상한은 5MB입니다. 넘으면 413(`urn:problem:payload-too-large`),
      jpeg·png가 아니면 415(`urn:problem:unsupported-media-type`), data URL이 아니거나 base64가 깨졌으면 422(`validation`)입니다.
      감사 이벤트와 기록에는 이미지 본문을 남기지 않고 형식·크기·SHA-256만 남깁니다.

    스트림
    - `POST /conversations/{conversationId}/messages`와 `POST /execution-approvals/{approvalId}`는 `text/event-stream`으로 답합니다.
      SSE `event:` 이름은 `ChatEvent.type`과 같고 `data:`는 `ChatEvent` JSON 한 줄입니다. 마지막은 항상 `done`입니다.
servers:
  - url: http://localhost:{port}/api
    variables:
      port: {default: "8010", description: PORT_BASE + 10}
security:
  - bearer: []
tags:
  - name: auth
  - name: chat
  - name: execution-approvals
  - name: actions
  - name: inbox
  - name: delegations
  - name: audit
  - name: ops
  - name: system

paths:
  /health:
    get:
      tags: [system]
      operationId: health
      security: []
      responses:
        "200":
          description: 살아 있음
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: {const: ok}

  /.well-known/jwks.json:
    get:
      tags: [system]
      operationId: getJwks
      security: []
      description: 위임 토큰 검증용 공개 키(JWK Set). erp·rag·MCP 서버가 씁니다.
      responses:
        "200":
          description: JWK Set
          content:
            application/json:
              schema:
                type: object
                required: [keys]
                properties:
                  keys:
                    type: array
                    items: {type: object}

  /auth/login:
    post:
      tags: [auth]
      operationId: login
      security: []
      description: erp `/auth/login`에 그대로 넘기고 결과를 돌려줍니다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [employeeNo, password]
              properties:
                employeeNo: {type: string}
                password: {type: string}
      responses:
        "200":
          description: 직원 JWT
          content:
            application/json:
              schema: {$ref: "erp.yaml#/components/schemas/LoginResponse"}
        "401": {$ref: "#/components/responses/Problem"}

  /auth/slack:
    post:
      tags: [auth]
      operationId: slackLogin
      security: []
      description: |
        슬랙 브리지만 부르는 로그인(#273). 헤더 `X-Slack-Bridge-Secret`이 gateway 설정(`SLACK_BRIDGE_SECRET`)과 맞고
        `slackUserId`가 매핑(로컬 설정 파일, 워크스페이스마다 다름)에 있으면, erp `POST /auth/service-login`으로 그 직원의
        짧은 직원 JWT(`amr: [slack]`)를 받아 돌려줍니다. 이 토큰으로는 사람 전용 기능(결재 승인·반려, 감사 조회 등)을 부를 수 없습니다(403).
        비밀값이 틀리거나 없으면 401, 매핑에 없는 슬랙 사용자면 403, `SLACK_BRIDGE_SECRET`이 설정되지 않았으면 404입니다.
        비밀값과 토큰은 로그·감사에 남기지 않습니다.
      parameters:
        - {name: X-Slack-Bridge-Secret, in: header, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [slackUserId]
              additionalProperties: false
              properties:
                slackUserId: {type: string, description: "슬랙 사용자 ID(예: U012ABCDEF)"}
      responses:
        "200":
          description: 직원 JWT(amr slack)
          content:
            application/json:
              schema: {$ref: "erp.yaml#/components/schemas/LoginResponse"}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}

  /me:
    get:
      tags: [auth]
      operationId: getMe
      responses:
        "200":
          description: 로그인한 직원
          content:
            application/json:
              schema: {$ref: "erp.yaml#/components/schemas/Employee"}

  /employees:
    get:
      tags: [org]
      operationId: searchEmployees
      description: 대리인 고르기. erp `GET /employees`를 그대로 넘깁니다(공개 필드만).
      parameters:
        - {name: q, in: query, schema: {type: string}, description: 이름 일부}
        - {name: unitId, in: query, schema: {type: string}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
      responses:
        "200":
          description: 직원 목록
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: "erp.yaml#/components/schemas/EmployeeSummary"}

  /org/units:
    get:
      tags: [org]
      operationId: listUnits
      description: 조직도의 본부·팀. erp `GET /org/units`를 그대로 넘깁니다. 로그인한 직원 누구나 봅니다.
      responses:
        "200":
          description: 본부·팀
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: "erp.yaml#/components/schemas/Unit"}

  /agent-registry:
    get:
      tags: [org]
      operationId: listAgentRegistry
      description: |
        에이전트 등록부. 팩 `agents.yaml`의 모든 에이전트(요청자가 부를 수 없는 것 포함)를 담당 부서·도구·정책과 함께 돌려줍니다.
        로그인한 직원 누구나 봅니다. 라우팅 예문과 비밀값은 넣지 않습니다.
      responses:
        "200":
          description: 등록부
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  fallbackAgentId: {type: string}
                  items:
                    type: array
                    items: {$ref: "#/components/schemas/AgentRegistryEntry"}

  /approval-forms:
    get:
      tags: [inbox]
      operationId: listApprovalForms
      description: 대결 범위의 양식 고르기. erp `GET /approval-forms`를 그대로 넘깁니다.
      responses:
        "200":
          description: 양식
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: "erp.yaml#/components/schemas/ApprovalForm"}

  /agents:
    get:
      tags: [chat]
      operationId: listAgents
      description: 로그인한 직원이 부를 수 있는 에이전트. 채팅 화면의 부서 선택에 씁니다.
      responses:
        "200":
          description: 에이전트
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: "agent.yaml#/components/schemas/AgentInfo"}

  /conversations:
    get:
      tags: [chat]
      operationId: listConversations
      responses:
        "200":
          description: 내 대화
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: "#/components/schemas/ConversationSummary"}
    post:
      tags: [chat]
      operationId: createConversation
      parameters:
        - name: X-Eval-Condition
          in: header
          required: false
          description: >-
            평가 전용. GATEWAY_EVAL_MODE=1일 때만 받고, 아니면 400(validation)입니다. gateway는 이 대화의
            agent /run에 condition으로 넘기고(이어지는 /resume은 agent 실행 상태가 조건을 기억합니다), 같은 대화의 출구 호출과 위임 토큰 발급에도 조건을 적용합니다. 조건별 장치 구성은 contracts/eval/conditions.md입니다.
          schema: {enum: [no_guard, write_blocked, approve_all, baseline_tools, full]}
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                agentId:
                  type: string
                  description: 직원이 부서 에이전트를 직접 고르면 넣습니다. 없으면 첫 메시지에서 입구 라우터가 고릅니다(한 번만)
      responses:
        "201":
          description: 새 대화
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ConversationSummary"}
        "400": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}

  /conversations/{conversationId}:
    get:
      tags: [chat]
      operationId: getConversation
      parameters:
        - $ref: "#/components/parameters/ConversationId"
      responses:
        "200":
          description: 대화와 지금까지의 이벤트
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Conversation"}
        "404": {$ref: "#/components/responses/Problem"}

  /conversations/{conversationId}/messages:
    post:
      tags: [chat]
      operationId: postMessage
      parameters:
        - $ref: "#/components/parameters/ConversationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              additionalProperties: false
              properties:
                content: {type: string, maxLength: 4000}
      responses:
        "200":
          description: SSE 스트림. 각 이벤트의 data는 ChatEvent
          content:
            text/event-stream:
              schema: {$ref: "#/components/schemas/ChatEvent"}
        "404": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
        "409":
          description: 실행 승인을 기다리는 중이라 새 메시지를 받지 않음
          content:
            application/problem+json:
              schema: {$ref: "erp.yaml#/components/schemas/Problem"}

  /execution-approvals/{approvalId}:
    post:
      tags: [execution-approvals]
      operationId: decideExecutionApproval
      description: 미리보기 카드에서 요청자 본인이 실행을 승인하거나 거절합니다. 이어지는 실행을 스트림으로 돌려줍니다.
      parameters:
        - name: approvalId
          in: path
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              additionalProperties: false
              properties:
                decision: {type: string, enum: [approve, reject]}
                comment: {type: string, maxLength: 200}
      responses:
        "200":
          description: SSE 스트림
          content:
            text/event-stream:
              schema: {$ref: "#/components/schemas/ChatEvent"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}

  /actions/{actionId}/undo:
    post:
      tags: [actions]
      operationId: undoAction
      description: 직원 JWT로 erp `POST /actions/{actionId}/undo`를 부릅니다. 응답·오류는 erp와 같습니다.
      parameters:
        - name: actionId
          in: path
          required: true
          schema: {type: string}
        - $ref: "erp.yaml#/components/parameters/IdempotencyKey"
      responses:
        "201":
          description: 되돌림
          content:
            application/json:
              schema: {$ref: "erp.yaml#/components/schemas/ActionResult"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}

  /inbox:
    get:
      tags: [inbox]
      operationId: listInbox
      description: 팀장 승인함. erp `GET /approval-documents`에 요청자·원 결재자 이름을 붙여 돌려줍니다.
      parameters:
        - name: box
          in: query
          required: true
          schema: {type: string, enum: [inbox, delegated, done, outbox]}
      responses:
        "200":
          description: 결재 문서
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: "#/components/schemas/InboxItem"}

  /inbox/{documentId}:
    get:
      tags: [inbox]
      operationId: getInboxItem
      parameters:
        - $ref: "#/components/parameters/DocumentId"
      responses:
        "200":
          description: 결재 문서
          content:
            application/json:
              schema: {$ref: "#/components/schemas/InboxItem"}
        "404": {$ref: "#/components/responses/Problem"}

  /inbox/{documentId}/approve:
    post:
      tags: [inbox]
      operationId: approveInboxItem
      description: 직원 JWT로 erp approve를 부릅니다. 대결이면 erp가 위임을 확인합니다.
      parameters:
        - $ref: "#/components/parameters/DocumentId"
        - $ref: "erp.yaml#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "erp.yaml#/components/schemas/DecisionRequest"}
      responses:
        "201":
          description: 승인됨
          content:
            application/json:
              schema: {$ref: "erp.yaml#/components/schemas/ActionResult"}
        "403": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}

  /inbox/{documentId}/reject:
    post:
      tags: [inbox]
      operationId: rejectInboxItem
      parameters:
        - $ref: "#/components/parameters/DocumentId"
        - $ref: "erp.yaml#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "erp.yaml#/components/schemas/DecisionRequest"}
      responses:
        "201":
          description: 반려됨
          content:
            application/json:
              schema: {$ref: "erp.yaml#/components/schemas/ActionResult"}
        "403": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}

  /delegations:
    get:
      tags: [delegations]
      operationId: listDelegations
      description: 대결 설정 화면. erp `GET /delegations`에 이름을 붙여 돌려줍니다.
      parameters:
        - name: role
          in: query
          required: true
          schema: {type: string, enum: [delegator, delegate, all]}
      responses:
        "200":
          description: 위임
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: "#/components/schemas/DelegationView"}
    post:
      tags: [delegations]
      operationId: createDelegation
      description: 직원 JWT로 erp `POST /delegations`를 부릅니다. dryRun으로 미리보기를 먼저 보여 줍니다.
      parameters:
        - $ref: "erp.yaml#/components/parameters/DryRun"
        - $ref: "erp.yaml#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "erp.yaml#/components/schemas/DelegationCreate"}
      responses:
        "200":
          description: 미리보기
          content:
            application/json:
              schema: {$ref: "erp.yaml#/components/schemas/WritePreview"}
        "201":
          description: 등록됨
          content:
            application/json:
              schema: {$ref: "erp.yaml#/components/schemas/ActionResult"}
        "403": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}

  /delegations/{delegationId}/revoke:
    post:
      tags: [delegations]
      operationId: revokeDelegation
      parameters:
        - name: delegationId
          in: path
          required: true
          schema: {type: string}
        - $ref: "erp.yaml#/components/parameters/IdempotencyKey"
      responses:
        "201":
          description: 해지됨
          content:
            application/json:
              schema: {$ref: "erp.yaml#/components/schemas/ActionResult"}
        "403": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}

  /notifications:
    get:
      tags: [inbox]
      operationId: listNotifications
      responses:
        "200":
          description: erp 알림(후열 포함)
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: "erp.yaml#/components/schemas/Notification"}

  /audit-events:
    get:
      tags: [audit]
      operationId: listAuditEvents
      description: |
        auditor 역할만. gateway·agent·MCP·rag·erp 감사 이벤트를 시각 순으로 합쳐 돌려줍니다.
        `order=desc`면 최근 것부터 돌려주고, `nextCursor`는 그 페이지 마지막 것보다 오래된 쪽을 가리킵니다.
      parameters:
        - {name: conversationId, in: query, schema: {type: string}}
        - {name: actorId, in: query, schema: {type: string}}
        - {name: agentId, in: query, schema: {type: string}}
        - {name: kind, in: query, schema: {type: string}}
        - {name: since, in: query, schema: {type: string, format: date-time}}
        - {name: until, in: query, schema: {type: string, format: date-time}}
        - {name: cursor, in: query, schema: {type: string}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 500, default: 100}}
        - {name: order, in: query, schema: {type: string, enum: [asc, desc], default: asc}, description: 시각 순서. 기본은 오래된 것부터}
      responses:
        "200":
          description: 감사 이벤트
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: "../events/audit.schema.json"}
                  nextCursor: {type: [string, "null"]}
        "403": {$ref: "#/components/responses/Problem"}

  /ops/metrics:
    get:
      tags: [ops]
      operationId: getOpsMetrics
      description: |
        auditor 역할만(관리자 콘솔). 기간 안의 감사 이벤트·외부 요청 기록에서 에이전트별 운영 지표를 셉니다.
        - 호출 수: `route.decided` 이벤트 수(직접 고른 대화의 `explicit` 포함)
        - 정책 차단: `tool.blocked`·`rag.access_denied`와 gateway가 막은 요청을 ChatEvent `blocked.code`로 나눈 수
        - 외부·로컬: `llm.request`의 `model.location`
        - 외부 비용: 외부 요청 기록(`events/external-request.schema.json`)의 `costUsd` 합. `null`인 요청은 `unpricedRequests`로 셉니다
        - 비용 상한: 팩 `budgets.yaml` 대비 사용량. 기간 필터와 관계없이 지금 누적 기간(`period`)의 값입니다
      parameters:
        - {name: since, in: query, description: 없으면 until의 24시간 전, schema: {type: string, format: date-time}}
        - {name: until, in: query, description: 없으면 지금, schema: {type: string, format: date-time}}
      responses:
        "200":
          description: 운영 지표
          content:
            application/json:
              schema: {$ref: "#/components/schemas/OpsMetrics"}
        "400": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}

  /ops/egress:
    get:
      tags: [ops]
      operationId: listEgressRecords
      description: |
        auditor 역할만(관리자 콘솔). 외부 모델로 실제 보낸 요청을 최근 것부터 돌려줍니다.
        가림 뒤 본문과 가린 자리(종류·위치)만 돌려주고, 가림 전 원문은 저장하지도 돌려주지도 않습니다.
        화면은 `redactions`의 위치로 가린 자리를 표시합니다.
      parameters:
        - {name: since, in: query, schema: {type: string, format: date-time}}
        - {name: until, in: query, schema: {type: string, format: date-time}}
        - {name: agentId, in: query, schema: {type: string}}
        - {name: cursor, in: query, schema: {type: string}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
      responses:
        "200":
          description: 외부 전송 기록
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: "#/components/schemas/EgressRecord"}
                  nextCursor: {type: [string, "null"]}
        "400": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}

components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        erp가 발급한 직원 JWT. 이 방식을 쓰는 사람용 경로는 모두 위임 토큰(gateway 발급, `agt` 클레임)을 받지 않고
        403 `delegation-token-not-allowed`를 돌려줍니다(erp.yaml `ProblemCode`). 아래 각 경로의 응답 목록에 403을 따로 적지 않은 곳도 같습니다.

  parameters:
    ConversationId:
      name: conversationId
      in: path
      required: true
      schema: {type: string}
    DocumentId:
      name: documentId
      in: path
      required: true
      schema: {type: string}

  responses:
    Problem:
      description: RFC 9457 오류
      content:
        application/problem+json:
          schema: {$ref: "erp.yaml#/components/schemas/Problem"}

  schemas:
    ConversationSummary:
      type: object
      required: [conversationId, createdAt, status]
      properties:
        conversationId: {type: string, description: LangGraph thread_id와 같음}
        agentId: {type: [string, "null"], description: 라우팅 전이면 null}
        agentName: {type: [string, "null"]}
        title: {type: [string, "null"]}
        status: {type: string, enum: [active, awaiting_approval, closed]}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}

    Conversation:
      allOf:
        - $ref: "#/components/schemas/ConversationSummary"
        - type: object
          required: [events]
          properties:
            events:
              type: array
              description: 지금까지의 사용자 메시지와 ChatEvent(화면 복원용)
              items:
                oneOf:
                  - type: object
                    required: [type, content, at]
                    properties:
                      type: {const: user_message}
                      content: {type: string}
                      at: {type: string, format: date-time}
                  - $ref: "#/components/schemas/ChatEvent"

    ChatEvent:
      type: object
      required: [type, conversationId, seq]
      description: SSE 이벤트 하나. type마다 쓰는 필드가 다릅니다
      properties:
        type:
          type: string
          enum: [route, delta, message, tool_call, approval_required, approval_decided, action, citations, blocked, error, done]
        conversationId: {type: string}
        seq: {type: integer, minimum: 0, description: 대화 안에서 늘어나는 번호}
        at: {type: string, format: date-time}
        route:
          description: type=route. 입구 라우터 결과(대화마다 한 번)
          type: object
          properties:
            agentId: {type: string}
            agentName: {type: string}
            method: {type: string, enum: [llm, keyword, fallback, explicit]}
            reason: {type: string}
            suggestedAgentId: {type: [string, "null"]}
        text:
          type: string
          description: type=delta(조각) 또는 message(완성된 답)
        toolCall:
          description: type=tool_call. 읽기 도구 실행 기록(화면에는 접어서 보여 줌)
          type: object
          properties:
            tool: {type: string}
            risk: {type: string, enum: [read, reversible_write, irreversible]}
            status: {type: string, enum: [ok, error, blocked]}
        approval:
          description: type=approval_required. 실행 전 미리보기 카드
          type: object
          required: [approvalId, tool, risk, preview]
          properties:
            approvalId: {type: string}
            tool: {type: string}
            toolLabel: {type: string}
            risk: {type: string, enum: [read, reversible_write, irreversible]}
            preview: {$ref: "erp.yaml#/components/schemas/WritePreview"}
            expiresAt: {type: string, format: date-time}
        decision:
          description: type=approval_decided
          type: object
          properties:
            approvalId: {type: string}
            decision: {type: string, enum: [approve, reject]}
        action:
          description: type=action. 실행된 erp 행동. undoable이면 화면에 되돌리기 버튼
          type: object
          required: [actionId, tool, summary, undoable]
          properties:
            actionId: {type: string}
            tool: {type: string}
            summary: {type: string}
            undoable: {type: boolean}
        citations:
          description: type=citations. 근거 조문
          type: array
          items: {$ref: "rag.yaml#/components/schemas/Citation"}
        blocked:
          description: type=blocked. 장치가 막은 이유(사용자에게 보여 줄 문장)
          type: object
          properties:
            reason: {type: string}
            code:
              type: string
              enum: [agent_not_callable, tool_not_allowed, trust_violation, policy_denied, scope_missing, model_policy]
        error:
          type: object
          properties:
            message: {type: string}
            retryable: {type: boolean}
        model:
          description: type=message·done. 쓴 모델(화면의 "로컬에서 처리" 표시)
          type: object
          properties:
            name: {type: string}
            location: {type: string, enum: [local, external]}

    InboxItem:
      allOf:
        - $ref: "erp.yaml#/components/schemas/ApprovalDocument"
        - type: object
          required: [formName, requesterName]
          properties:
            formName: {type: string}
            requesterName: {type: string}
            requesterUnitName: {type: string}
            steps:
              type: array
              description: erp 결재선 단계에 이름을 붙입니다
              items:
                type: object
                required: [approverName]
                properties:
                  approverName: {type: string}
                  actedByName: {type: [string, "null"]}
            viaDelegation:
              type: [object, "null"]
              description: 대결로 내 함에 들어온 것이면 원 결재자와 위임
              properties:
                delegationId: {type: string}
                originalApproverId: {type: string}
                originalApproverName: {type: string}
                endsAt: {type: string, format: date-time}

    DelegationView:
      allOf:
        - $ref: "erp.yaml#/components/schemas/Delegation"
        - type: object
          required: [delegatorName, delegateName]
          properties:
            delegatorName: {type: string}
            delegateName: {type: string}

    OpsMetrics:
      type: object
      required: [since, until, totals, agents, routing]
      properties:
        since: {type: string, format: date-time}
        until: {type: string, format: date-time}
        totals: {$ref: "#/components/schemas/OpsCounts"}
        agents:
          type: array
          description: 팩에 있는 에이전트마다 한 줄(기간 안에 호출이 없어도 0으로)
          items:
            allOf:
              - type: object
                required: [agentId, agentName]
                properties:
                  agentId: {type: string}
                  agentName: {type: string}
              - $ref: "#/components/schemas/OpsCounts"
        routing:
          type: object
          description: 입구 라우팅 결과(`route.decided`의 `routing.method`)별 수
          required: [total, byMethod]
          properties:
            total: {type: integer, minimum: 0}
            byMethod:
              type: object
              properties:
                llm: {type: integer, minimum: 0}
                keyword: {type: integer, minimum: 0}
                fallback: {type: integer, minimum: 0}
                explicit: {type: integer, minimum: 0}
        budgets:
          type: [object, "null"]
          description: 팩 `budgets.yaml`이 없으면 null
          required: [period, periodStart, agents, units]
          properties:
            period: {type: string, enum: [day, month]}
            periodStart: {type: string, format: date-time, description: 지금 누적 기간의 시작(팩 시간대 기준)}
            agents:
              type: array
              items: {$ref: "#/components/schemas/BudgetUsage"}
            units:
              type: array
              items: {$ref: "#/components/schemas/BudgetUsage"}

    OpsCounts:
      type: object
      required: [calls, blocked, llmRequests, externalCostUsd]
      properties:
        calls: {type: integer, minimum: 0, description: 에이전트 실행 수(`route.decided`)}
        blocked:
          type: object
          required: [total, byCode]
          properties:
            total: {type: integer, minimum: 0}
            byCode:
              type: object
              description: ChatEvent `blocked.code` 값 → 수. 0인 코드는 빼도 됩니다
              propertyNames:
                enum: [agent_not_callable, tool_not_allowed, trust_violation, policy_denied, scope_missing, model_policy]
              additionalProperties: {type: integer, minimum: 0}
        llmRequests:
          type: object
          required: [local, external]
          properties:
            local: {type: integer, minimum: 0}
            external: {type: integer, minimum: 0}
        externalCostUsd: {type: number, minimum: 0}
        unpricedRequests: {type: integer, minimum: 0, description: "외부 요청 중 비용을 모르는(`costUsd: null`) 수"}

    BudgetUsage:
      type: object
      required: [id, limitUsd, usedUsd]
      properties:
        id: {type: string, description: 에이전트 ID 또는 부서 ID}
        name: {type: string}
        limitUsd: {type: number, minimum: 0}
        usedUsd: {type: number, minimum: 0}
        exceeded: {type: boolean, description: 상한을 넘어 외부 요청을 로컬로 내리는 중}

    EgressRecord:
      type: object
      description: 외부 요청 기록 한 건. 가림 전 원문은 없습니다
      required: [recordId, at, agentId, conversationId, model, messages, redactions]
      properties:
        recordId: {type: string}
        at: {type: string, format: date-time}
        agentId: {type: [string, "null"]}
        agentName: {type: [string, "null"]}
        conversationId: {type: [string, "null"]}
        actorId: {type: [string, "null"], description: 요청한 직원(위임 토큰 sub)}
        model: {type: string, description: LiteLLM에 넘긴 실제 모델 이름}
        usage:
          type: [object, "null"]
          properties:
            promptTokens: {type: integer, minimum: 0}
            completionTokens: {type: integer, minimum: 0}
        costUsd: {type: [number, "null"]}
        messages:
          type: array
          description: 외부로 보낸 요청 본문의 messages(가림 뒤). 문자열이 아닌 content는 텍스트 부분만 이어 붙입니다
          items:
            type: object
            required: [role, content]
            properties:
              role: {type: string}
              content: {type: string}
        redactions:
          type: array
          description: 가린 자리. 위치는 가림 뒤 `messages[messageIndex].content`에서 바꿔 넣은 표시(`placeholder`)의 UTF-16 범위입니다(JavaScript 문자열 위치와 같음)
          items:
            type: object
            required: [entity, placeholder, messageIndex, start, end]
            properties:
              entity: {type: string, description: "가린 종류(예: KR_RRN, KR_PHONE, EMAIL_ADDRESS)"}
              placeholder: {type: string, description: "바꿔 넣은 표시(예: [주민등록번호])"}
              messageIndex: {type: integer, minimum: 0}
              start: {type: integer, minimum: 0}
              end: {type: integer, minimum: 0}

    AgentRegistryEntry:
      type: object
      description: 팩 agents.yaml 항목을 화면용으로 옮긴 것(이름은 camelCase)
      required: [id, name, version, stage, ownerUnitId, description, tools, allowedRisk, modelPolicy, riskPolicy]
      properties:
        id: {type: string}
        name: {type: string}
        version: {type: string}
        stage: {type: integer, minimum: 1}
        ownerUnitId: {type: string}
        ownerUnitName: {type: [string, "null"]}
        description: {type: string}
        callable: {type: boolean, description: 요청자가 부를 수 있는지}
        callableBy:
          description: 팩 `callable_by`. all 또는 units·roles·grades
          oneOf:
            - {type: string, const: all}
            - type: object
              properties:
                units: {type: array, items: {type: string}}
                roles: {type: array, items: {type: string}}
                grades: {type: array, items: {type: string}}
        tools:
          type: array
          items:
            type: object
            required: [name, risk]
            properties:
              name: {type: string, description: contracts/mcp/tools.json 도구 이름}
              title: {type: string, description: 도구 설명 첫 문장}
              risk: {type: string, enum: [read, reversible_write, irreversible]}
        allowedRisk:
          type: array
          items: {type: string, enum: [read, reversible_write, irreversible]}
        docScopes:
          type: array
          items: {type: string}
        modelPolicy:
          type: object
          required: [mode]
          properties:
            mode: {type: string, enum: [external_allowed, local_only]}
            reason: {type: string}
        riskPolicy:
          type: object
          required: [read, reversibleWrite, irreversible]
          properties:
            read: {$ref: "#/components/schemas/RiskAction"}
            reversibleWrite: {$ref: "#/components/schemas/RiskAction"}
            irreversible: {$ref: "#/components/schemas/RiskAction"}
            overrides:
              type: array
              items:
                type: object
                required: [tool, when, action]
                properties:
                  tool: {type: string}
                  when:
                    type: string
                    enum: [wide_scope, always, arg_gt]
                    description: 팩 `risk_policy.overrides[].when`. 팩의 인자 조건 `{arg, gt}`는 `arg_gt`로 쓰고 `arg`·`gt`에 값을 둡니다
                  arg: {type: string, description: when=arg_gt일 때 견줄 도구 인자 이름}
                  gt: {type: number, description: when=arg_gt일 때 이 값보다 크면 맞음}
                  action: {$ref: "#/components/schemas/RiskAction"}
        routingKeywords:
          type: array
          items: {type: string}

    RiskAction:
      type: string
      enum: [auto, auto_with_undo, confirm, deny]
      description: "auto: 바로 실행. auto_with_undo: 실행하고 되돌리기 안내. confirm: 미리보기 카드로 실행 승인. deny: 이 에이전트에서 금지"
