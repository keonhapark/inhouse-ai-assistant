openapi: 3.1.0
info:
  title: agent (에이전트 런타임과 입구 라우터)
  version: 0.1.0
  description: |
    gateway만 부르는 내부 API입니다. `/route`는 요청을 에이전트 하나로 한 번만 넘깁니다(에이전트끼리 넘기지 않음).
    `/run`·`/resume`은 LangGraph thread(= conversationId)를 이어 갑니다. 위임 토큰은 `X-Delegation-Token` 헤더로만 받고
    MCP 요청과 gateway LLM 출구 요청의 헤더로만 넘깁니다. 모델 문맥·로그에는 넣지 않습니다.
    위험 등급이 confirm인 도구는 실행 전에 멈추고(`awaiting_approval`) 미리보기(erp dryRun 결과)를 돌려줍니다.
servers:
  - url: http://localhost:{port}
    variables:
      port: {default: "8020", description: PORT_BASE + 20}
paths:
  /health:
    get:
      operationId: health
      responses:
        "200":
          description: 살아 있음
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: {const: ok}
  /agents:
    get:
      operationId: listAgents
      description: 팩 등록부의 에이전트(이 단계에서 켜진 것)
      responses:
        "200":
          description: 에이전트
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: "#/components/schemas/AgentInfo"}
  /route:
    post:
      operationId: route
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message, requester]
              additionalProperties: false
              properties:
                message: {type: string}
                requester: {$ref: "#/components/schemas/Requester"}
                method:
                  type: string
                  enum: [llm, keyword]
                  default: llm
                  description: keyword는 기준선 비교용
      responses:
        "200":
          description: 라우팅 결과
          content:
            application/json:
              schema: {$ref: "#/components/schemas/RouteDecision"}
  /run:
    post:
      operationId: run
      parameters:
        - $ref: "#/components/parameters/DelegationToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [conversationId, agentId, message, requester]
              additionalProperties: false
              properties:
                conversationId: {type: string}
                agentId: {type: string}
                message: {type: string}
                requester: {$ref: "#/components/schemas/Requester"}
                condition:
                  $ref: "#/components/schemas/Condition"
                routeMethod:
                  type: string
                  enum: [llm, keyword, fallback, explicit]
                  description: >-
                    이 대화를 연 라우팅 방식(gateway가 `/route` 결과의 `method`를 넘김, #308). `fallback`이면 라우터가
                    부서를 고르지 못한 것이라 fallback 에이전트의 모델 정책과 관계없이 그 대화 끝까지 로컬 별칭으로
                    실행합니다(로컬도 실패하면 오류로 끝나고 외부로 가지 않음). 첫 턴에만 넘겨도 됩니다
                attachments:
                  type: array
                  maxItems: 3
                  items: {$ref: "#/components/schemas/Attachment"}
                  description: >-
                    이 턴에 사용자가 붙인 이미지(#281 영수증 등). 첨부를 다룰 수 있는 에이전트만 씁니다(지금은 경비 정산 도구가
                    있는 에이전트). 이미지는 gateway의 로컬 비전 별칭으로만 읽고, 읽은 글자는 신뢰할 수 없는 내용으로 다룹니다.
                    이미지 본문은 그래프 상태·감사·로그에 남기지 않습니다
      responses:
        "200":
          description: 실행 상태
          content:
            application/json:
              schema: {$ref: "#/components/schemas/RunState"}
  /resume:
    post:
      operationId: resume
      parameters:
        - $ref: "#/components/parameters/DelegationToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [conversationId, approvalId, decision]
              additionalProperties: false
              properties:
                conversationId: {type: string}
                approvalId: {type: string}
                decision: {type: string, enum: [approve, reject]}
                comment: {type: string}
      responses:
        "200":
          description: 실행 상태
          content:
            application/json:
              schema: {$ref: "#/components/schemas/RunState"}
        "409":
          description: 이미 결정됐거나 기다리는 승인이 아님
  /baseline/slots:
    post:
      operationId: baselineSlots
      description: >-
        기능 품질 비교용. 휴가·회의실 요청에서 도구와 인자를 채워 돌려주고 실행하지 않습니다. rule은 LLM 없는
        규칙 파서, llm은 gateway를 거친 도구 호출 한 번입니다. eval이 같은 인자로 erp를 불러 결과를 비교합니다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message, method]
              additionalProperties: false
              properties:
                message: {type: string}
                today: {type: string, format: date, description: 기준 날짜. 없으면 오늘(Asia/Seoul)}
                method: {type: string, enum: [rule, llm]}
      responses:
        "200":
          description: 채운 슬롯
          content:
            application/json:
              schema:
                type: object
                required: [intent, tool, arguments, missing]
                additionalProperties: false
                properties:
                  intent: {type: [string, "null"], enum: [leave, room, null]}
                  tool:
                    type: [string, "null"]
                    enum: [leave_request, room_reserve, room_list_availability, null]
                  arguments: {type: object, description: contracts/mcp/tools.json의 그 도구 입력 스키마대로}
                  missing: {type: array, items: {type: string}, description: 채우지 못한 필수 슬롯 이름}

  /eval/tool-call:
    post:
      operationId: evalToolCall
      description: >-
        평가 전용(로컬 모델 도구 호출 측정, #103). `AGENT_EVAL_MODE=1`일 때만 있고 아니면 404입니다. 요청 하나에 대해
        업무 실행의 첫 계획 호출만 하고, 도구를 실행하지 않습니다(MCP·erp를 부르지 않음). 도구 목록은
        `contracts/mcp/tools.json`에서 그 에이전트 등록부에 있는 것입니다. 위임 토큰 없이 gateway를 부릅니다.
        채점(정답 비교, 스키마 검사)은 eval이 합니다. 응답의 `content`는 모델이 쓴 문장이라 감사·로그에 넣지 않습니다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message, agentId, requester, today]
              additionalProperties: false
              properties:
                message: {type: string}
                agentId: {type: string}
                requester: {$ref: "#/components/schemas/Requester"}
                today: {type: string, format: date, description: "기준 날짜(재현을 위해 필수, Asia/Seoul)"}
                model:
                  type: string
                  description: >-
                    gateway 출구 별칭(LiteLLM model_name, 예 local, external). 없으면 에이전트 모델 정책의 별칭입니다
                variant: {$ref: "#/components/schemas/ToolCallVariant"}
      responses:
        "200":
          description: 첫 계획 호출 결과
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ToolCallResult"}
        "400":
          description: 모르는 에이전트, 이 단계에서 꺼진 에이전트, 지원하지 않는 변형(예 grammar를 지원하지 않는 별칭)
        "404":
          description: 평가 모드가 아님
        "502":
          description: gateway·모델 호출 실패(eval은 실행 환경 문제로 셉니다)

components:
  parameters:
    DelegationToken:
      name: X-Delegation-Token
      in: header
      required: true
      schema: {type: string}
  schemas:
    Attachment:
      type: object
      required: [kind, dataUrl]
      additionalProperties: false
      properties:
        kind: {type: string, enum: [image]}
        dataUrl:
          type: string
          pattern: "^data:image/(jpeg|png);base64,"
          description: jpeg·png data URL. 한 장의 디코딩 크기 상한은 5MB입니다(gateway 이미지 입력과 같은 제한)
    ToolCallVariant:
      type: object
      additionalProperties: false
      description: 측정 단계(S0~S3)를 이루는 장치. 모두 끄면 S0(지금 업무 실행과 같은 프롬프트·도구)입니다
      properties:
        grammar:
          type: boolean
          default: false
          description: >-
            도구 인자를 JSON 스키마로 강제합니다. 도구 고르기와 인자 채우기를 두 호출로 나누고, 인자 호출에
            response_format(json_schema)을 붙입니다. 별칭이 구조화 출력을 지원하지 않으면 400입니다
        toolFilterK:
          type: [integer, "null"]
          minimum: 1
          default: null
          description: 모델 앞에서 후보 도구를 k개로 줄입니다. null이면 줄이지 않습니다
        fewShot:
          type: boolean
          default: false
          description: 도구별 예시(개발 묶음에서 뽑아 agent에 둔 것)를 프롬프트에 넣습니다
        thinking:
          type: [boolean, "null"]
          default: null
          description: 생각 단계 켬·끔. false면 reasoning_effort=none, true면 low로 보냅니다. null이면 보내지 않습니다(모델 기본값)
    ToolCallResult:
      type: object
      required: [tool, arguments, rawArguments, content, asked, candidates, model, latencyMs, llmCalls, usage]
      additionalProperties: false
      properties:
        tool: {type: [string, "null"], description: 첫 도구 호출의 도구 이름. 부르지 않았으면 null(모르는 이름도 그대로)}
        arguments: {type: [object, "null"], description: "인자를 JSON 객체로 읽었으면 그 값, 못 읽었으면 null"}
        rawArguments: {type: [string, "null"], description: 모델이 낸 인자 문자열 그대로}
        content: {type: string, description: 모델이 쓴 문장(되묻기 판정용). 감사·로그에 넣지 않습니다}
        asked: {type: boolean, description: 도구를 부르지 않고 되묻는 모양으로 답함(eval/protocol.md 2절과 같은 기준)}
        candidates:
          type: array
          items: {type: string}
          description: 모델에 보인 도구 이름(toolFilterK를 쓰면 줄인 목록). 정답 도구가 남았는지(재현율) 보는 데 씁니다
        model:
          type: object
          required: [requested, egress, location]
          additionalProperties: false
          properties:
            requested: {type: string, description: 요청한 별칭}
            egress: {type: [string, "null"], description: gateway X-Egress-Model}
            location: {type: [string, "null"], enum: [local, external, null], description: gateway X-Egress-Location}
        latencyMs: {type: integer, minimum: 0, description: 이 요청의 모델 호출 시간 합(grammar면 두 호출)}
        llmCalls: {type: integer, minimum: 1}
        usage:
          type: [object, "null"]
          required: [promptTokens, completionTokens]
          additionalProperties: false
          description: 모델 호출의 토큰 합. gateway가 usage를 주지 않으면 null
          properties:
            promptTokens: {type: integer, minimum: 0}
            completionTokens: {type: integer, minimum: 0}
    Condition:
      type: string
      enum: [no_guard, write_blocked, approve_all, baseline_tools, full]
      default: full
      description: 평가 다섯 조건. 운영에서는 full만 씁니다. 조건별 장치 구성은 contracts/eval/conditions.md입니다
    Requester:
      type: object
      required: [employeeId, unitId, grade, roles]
      properties:
        employeeId: {type: string}
        unitId: {type: string}
        grade: {type: string}
        roles: {type: array, items: {type: string}}
    AgentInfo:
      type: object
      required: [id, name, description, modelPolicy]
      properties:
        id: {type: string}
        name: {type: string}
        description: {type: string}
        modelPolicy: {type: string, enum: [external_allowed, local_only]}
        callable: {type: boolean, description: 요청자가 부를 수 있는지(route에 requester를 줄 때)}
    RouteDecision:
      type: object
      required: [agentId, method, reason]
      properties:
        agentId: {type: string, description: 고르지 못하면 fallback 에이전트}
        method: {type: string, enum: [llm, keyword, fallback, explicit]}
        reason: {type: string}
        confidence: {type: [number, "null"]}
        suggestedAgentId: {type: [string, "null"], description: fallback일 때 안내만 하는 부서 에이전트}
    ToolPreview:
      type: object
      required: [tool, risk, arguments, preview]
      properties:
        tool: {type: string}
        toolLabel: {type: string, description: "직원 화면에 보이는 도구 이름(#575). 팩 pack.yaml tool_display_names > 팩 양식 tool.displayName > tools.json displayName 순. gateway가 ChatEvent approval.toolLabel로 넘깁니다"}
        risk: {type: string, enum: [read, reversible_write, irreversible]}
        arguments: {type: object}
        preview:
          type: object
          description: erp WritePreview(summary, changes, undoable, warnings)
        fromAttachments:
          type: boolean
          description: 이 대화에서 첨부 이미지를 읽은 적이 있으면 true입니다(읽은 턴과 그 뒤 턴, #530). 되물은 뒤 다음 턴에 나온 미리보기에도 이미지에서 읽은 값이 인자로 쓰일 수 있어 대화가 끝날 때까지 남깁니다. 인자 일부가 이미지에서 읽은 신뢰 불가 값일 수 있습니다(결정 0004). gateway가 ChatEvent approval로 넘깁니다
    ExecutedAction:
      type: object
      required: [tool, actionId, summary, undoable]
      properties:
        tool: {type: string}
        toolLabel: {type: string, description: "직원 화면에 보이는 도구 이름(#575, ToolPreview.toolLabel과 같은 규칙)"}
        actionId: {type: string}
        summary: {type: string}
        undoable: {type: boolean}
    RunState:
      type: object
      required: [conversationId, agentId, status, messages]
      properties:
        conversationId: {type: string}
        agentId: {type: string}
        status:
          type: string
          enum: [completed, awaiting_approval, awaiting_user, blocked, failed]
          description: awaiting_user는 되묻기
        messages:
          type: array
          items:
            type: object
            required: [role, content]
            properties:
              role: {type: string, enum: [assistant]}
              content: {type: string}
        pendingApproval:
          type: [object, "null"]
          required: [approvalId, toolPreview]
          properties:
            approvalId: {type: string}
            toolPreview: {$ref: "#/components/schemas/ToolPreview"}
        actions:
          type: array
          items: {$ref: "#/components/schemas/ExecutedAction"}
        citations:
          type: array
          items: {type: object, description: rag Citation}
        blockedReason: {type: [string, "null"]}
