# LiteLLM 프록시 설정. gateway가 정책을 확인한 뒤 이 프록시로 넘깁니다.
# 실행: uvx --from 'litellm[proxy]==1.108.1' litellm --config gateway/litellm/config.yaml --port $PORT_LITELLM
# 호출하는 쪽(agent·rag)은 model에 아래 model_name(별칭)만 씁니다. gateway는 model_info.location으로
# 로컬·외부를 가르고, 에이전트 정책(local_only)이면 외부 별칭을 막습니다.
model_list:
  - model_name: local
    litellm_params:
      model: ollama_chat/qwen3.5:9b
      api_base: os.environ/OLLAMA_BASE_URL
      num_ctx: 8192                                  # docs/measurements/0-memory.md: 세션 동시 실행 메모리 여유
    model_info:
      location: local
      # Ollama 0.40의 MLX 실행기에서 qwen3.5:9b는 구조화 출력(format)을 지원하지 않습니다
      # ("structured output is unavailable"). gateway가 response_format 요청을 400으로 돌려줍니다.
      supports_response_format: false

  - model_name: local-embed                          # rag 벡터 검색용 임베딩. 로컬만
    litellm_params:
      model: ollama/bge-m3
      api_base: os.environ/OLLAMA_BASE_URL
    model_info:
      location: local
      mode: embedding

  - model_name: external
    litellm_params:
      model: anthropic/claude-haiku-5-5              # $0.10 / $0.50 per MTok(프롬프트 100K 이하), 문맥 1M
      api_key: os.environ/ANTHROPIC_API_KEY
    model_info:
      location: external
      # Claude Haiku 5.5는 기본값이 아닌 샘플링 값을 400으로 거절합니다. LiteLLM 1.108.1도 빼지만(실측),
      # 판이 바뀌어도 400이 나지 않게 gateway가 먼저 뺍니다. 추론 조절은 reasoning_effort로 합니다.
      drop_params: [temperature, top_p]

litellm_settings:
  request_timeout: 60
  num_retries: 0          # 재시도는 gateway가 정하지 않고 호출하는 쪽이 정합니다
  drop_params: true
