# LiteLLM 프록시 설정. gateway가 정책을 확인한 뒤 이 프록시로 넘깁니다.
# 실행: uvx --from 'litellm[proxy]==1.108.1' litellm --config gateway/litellm/config.yaml --port $PORT_LITELLM
# 호출하는 쪽(agent·rag)은 model에 아래 model_name(별칭)만 씁니다. gateway는 model_info.location으로
# 로컬·외부를 가르고, 에이전트 정책(local_only)이면 외부 별칭을 막습니다.
model_list:
  - model_name: local
    litellm_params:
      model: ollama_chat/qwen3.5:9b
      api_base: os.environ/OLLAMA_BASE_URL
      num_ctx: 8192                                  # docs/measurements/0-memory.md: 세션 동시 실행 메모리 여유
    model_info:
      location: local
      # Ollama 0.40의 MLX 실행기에서 qwen3.5:9b는 구조화 출력(format)을 지원하지 않습니다
      # ("structured output is unavailable"). gateway가 response_format 요청을 400으로 돌려줍니다.
      supports_response_format: false

  - model_name: local-gguf                           # 구조화 출력(response_format)이 되는 로컬 판(#205)
    litellm_params:
      # 같은 Qwen3.5-9B의 GGUF Q4_K_M 판(llama.cpp 실행기, Ollama digest 56671c2ab938, 6.6GB).
      # local(qwen3.5:9b, safetensors nvfp4, MLX 실행기, digest d63f830f28d5)과 양자화·실행기가 다릅니다.
      model: ollama_chat/qwen3.5:9b-q4_K_M
      api_base: os.environ/OLLAMA_BASE_URL
      num_ctx: 8192
    model_info:
      location: local
      supports_response_format: true

  - model_name: local-vision                         # 이미지 입력 전용(#261). 이미지가 든 요청은 gateway가 모두 여기로 보냅니다
    litellm_params:
      # local-gguf와 같은 Qwen3.5-9B GGUF Q4_K_M(Apache-2.0, Ollama 능력 vision 포함). 새 모델을 받지 않고 이미 받은
      # 가중치를 씁니다. 지어낸 영수증 PNG(420x400)에서 가맹점·날짜·합계를 읽음(2026-11-21 실측, PR 본문).
      model: ollama_chat/qwen3.5:9b-q4_K_M
      api_base: os.environ/OLLAMA_BASE_URL
      num_ctx: 8192
    model_info:
      location: local
      vision: true
      supports_response_format: true

  - model_name: local-embed                          # rag 벡터 검색용 임베딩. 로컬만
    litellm_params:
      model: ollama/bge-m3
      api_base: os.environ/OLLAMA_BASE_URL
    model_info:
      location: local
      mode: embedding

  - model_name: external
    litellm_params:
      model: anthropic/claude-haiku-5-5              # $0.10 / $0.50 per MTok(프롬프트 100K 이하), 문맥 1M
      api_key: os.environ/ANTHROPIC_API_KEY
    model_info:
      location: external
      # Claude Haiku 5.5는 기본값이 아닌 샘플링 값을 400으로 거절합니다. LiteLLM 1.108.1도 빼지만(실측),
      # 판이 바뀌어도 400이 나지 않게 gateway가 먼저 뺍니다. 추론 조절은 reasoning_effort로 합니다.
      drop_params: [temperature, top_p]
      # 단가(USD/토큰, 프롬프트 100K 이하). LiteLLM 가격표와 같고, 비용 머리글이 없는 스트림의 비용 계산에 gateway가 씁니다.
      input_cost_per_token: 0.0000001
      output_cost_per_token: 0.0000005

litellm_settings:
  request_timeout: 60
  num_retries: 0          # 재시도는 gateway가 정하지 않고 호출하는 쪽이 정합니다
  drop_params: true
