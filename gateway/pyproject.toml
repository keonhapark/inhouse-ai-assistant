[project]
name = "gateway"
version = "0.1.0"
description = "web이 부르는 유일한 서버. 위임 토큰 발급, erp 중계, LLM 출구"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.165.0",
  "uvicorn==0.54.0",
  "pyjwt[crypto]==2.15.1",
  "pyyaml==6.0.3",
  "httpx==0.28.1",
  "presidio-analyzer==2.2.366",
  "presidio-anonymizer==2.2.366",
  "pillow==13.0.0",
]

[dependency-groups]
# 시험은 contracts/의 가짜 erp를 프로세스 안에서 띄웁니다(jsonschema는 그쪽 의존입니다).
dev = ["pytest==9.2.0", "jsonschema==4.26.0"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
